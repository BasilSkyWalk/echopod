name: themes

on:
  push:
    branches: [main]
    paths:
      - "themes/**"
      - "assets/themes/**"
      - "web/editor/**"
      - "web/gallery-service/**"
      - "platform/web/**"
      - "src/**"
      - "cmake/wasm32.cmake"
      - "tools/theme_pack.py"
      - "tools/scene_compile.py"
      - "tools/web_editor.py"
      - "tools/demo_library.py"
      - ".github/workflows/themes.yml"
  pull_request:
    paths:
      - "themes/**"
      - "assets/themes/**"
      - "web/editor/**"
      - "web/gallery-service/**"
      - "platform/web/**"
      - "src/ui/**"
      - "src/np_faces/**"
      - "cmake/wasm32.cmake"
      - "tools/theme_pack.py"
      - "tools/scene_compile.py"
      - "tools/web_editor.py"
      - "tools/demo_library.py"
      - ".github/workflows/themes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: themes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the tools' packages
        run: python -m pip install -r tools/requirements.txt
      - name: Check the shared themes
        run: |
          {
            echo '### Shared themes'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          python tools/theme_pack.py --themes themes --base assets/themes/dark.toml \
            --definitions src/ui/include/ui --output build/themes --strict 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Install the WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ninja-build
      - name: Build the preview
        run: |
          cmake --preset web
          cmake --build --preset web
      - name: Build the site
        run: >
          python tools/web_editor.py --pages web/editor
          --module build/web/platform/web/echo_preview.wasm
          --themes assets/themes --community themes --definitions src/ui/include/ui
          --glyphs assets/fonts/glyph_pack.json --packs src/fonts/packs
          --service "${{ vars.GALLERY_SERVICE }}" --turnstile "${{ vars.GALLERY_TURNSTILE }}"
          --output build/web-editor
      - name: Draw every theme
        run: node web/editor/render_theme.mjs build/web-editor
      - name: Test the packer and the pages
        run: python -m unittest tools.tests.test_theme_pack tools.tests.test_web_editor
      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: build/web-editor/previews
          if-no-files-found: error
      - if: github.event_name != 'pull_request' && vars.THEME_SITE == 'on'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-editor

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.THEME_SITE == 'on'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  picture:
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PULL: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      SITE_RESULT: ${{ needs.site.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STORE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      STORE_BRANCH: gallery-previews
    steps:
      - id: themes
        name: Find the themes the pull request adds or changes
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPOSITORY/pulls/$PULL/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' \
            | sed -nE 's#^themes/([a-z0-9][a-z0-9_-]{0,22})\.toml$#\1#p' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - if: steps.themes.outputs.files != '' && needs.site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: theme-previews
          path: previews
      - if: steps.themes.outputs.files != ''
        name: Show each theme in a comment on the pull request
        env:
          FILES: ${{ steps.themes.outputs.files }}
        run: |
          set -euo pipefail
          marker='<!-- theme-picture -->'
          body="$marker"$'\n'
          if [ "$SITE_RESULT" = success ]; then
            git init -q store
            git -C store config user.name "github-actions[bot]"
            git -C store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C store remote add origin "$STORE"
            kept=""
            for attempt in 1 2 3 4 5; do
              if git -C store fetch -q --depth 1 origin "$STORE_BRANCH" 2>/dev/null; then
                git -C store checkout -q -B "$STORE_BRANCH" FETCH_HEAD
              else
                git -C store checkout -q --orphan "$STORE_BRANCH" 2>/dev/null || true
              fi
              for file in $FILES; do
                cp "previews/$file.png" "store/pull-$PULL-$file.png"
              done
              git -C store add -A
              git -C store diff --cached --quiet || git -C store commit -q -m "Theme pictures for pull request $PULL"
              if git -C store push -q origin "HEAD:refs/heads/$STORE_BRANCH"; then
                kept=$(git -C store rev-parse HEAD)
                break
              fi
              sleep $((attempt * 3))
            done
            if [ -z "$kept" ]; then
              echo "the pictures could not be stored" >&2
              exit 1
            fi
            for file in $FILES; do
              body+=$'\n'"**$file**"$'\n\n'"![$file on the player's screens](https://raw.githubusercontent.com/$REPOSITORY/$kept/pull-$PULL-$file.png)"$'\n'
            done
            body+=$'\n'"It packs and passes the reading checks."
          elif [ "$SITE_RESULT" = failure ]; then
            body+=$'\n'"The \`themes\` check didn't pass, so there is no picture. [See what it found]($RUN_URL)."
          else
            exit 0
          fi
          shown=$(gh api "repos/$REPOSITORY/issues/$PULL/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- theme-picture -->"))) | .id')
          shown=${shown%%$'\n'*}
          if [ -n "$shown" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$shown" -f body="$body" > /dev/null
          else
            gh api "repos/$REPOSITORY/issues/$PULL/comments" -f body="$body" > /dev/null
          fi
