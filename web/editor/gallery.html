<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EchoPod themes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="gallery">
    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>EchoPod Themes</span>
        <a
          class="trial"
          href="https://github.com/BasilSkyWalk/echopod/issues"
          target="_blank"
          rel="noopener"
          title="New and still changing. Click to tell us what breaks or confuses."
          >Experimental</a
        >
      </div>
      <span class="theme-name"></span>
      <div class="bar-actions">
        <a class="make" href="index.html">Make your own</a>
      </div>
    </header>
    <main id="gallery-page">
      <h1>Themes for the player</h1>
      <p class="note">
        Download a theme, copy the file into a folder called <code>Themes</code> at the top of the
        player's microSD card, then pick it under Settings, Display, Theme. Or open one in the
        editor and make it yours.
      </p>
      <div class="gallery-tools">
        <p id="status" role="status">Loading the themes…</p>
        <label class="sorting" hidden>
          <span>Show</span>
          <select id="sorting">
            <option value="listed">Shared themes first</option>
            <option value="liked">Most liked first</option>
          </select>
        </label>
      </div>
      <div id="gallery"></div>
    </main>
    <script type="module" src="gallery.js"></script>
  </body>
</html>
