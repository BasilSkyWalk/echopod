[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 90
    rect(p0_0, y, 230, 147, #08080a)
    menu(x, y, 90, 146)
    rect(p0_0, y, 1, 146, #2b2b2c)
} else {
    let p0_0 = x - 30
    let p0_1 = y + 146
    rect(p0_0, p0_1, 230, 147, #08080a)
    menu(x, y, 170, 146)
    rect(p0_0, p0_1, 230, 1, #2b2b2c)
}
if 1 {
    let at_x = width > height ? x + 204 : x + 84
    let at_y = width > height ? y + 4 : y + 150
    if has_cover {
        cover(at_x, at_y, 112)
        reflect(at_x, at_y, 112, 26)
    } else {
        rect(at_x, at_y, 112, 112, #08080a)
    }
}
if width > height {
    let p0_0 = x + 94
    let p0_1 = x + 101
    let p0_2 = y + 121
    let p0_3 = y + 126
    line(artist, body, p0_1, y + 14, 100, 21, center, #a7a7ad)
    line(song, title, p0_1, y + 38, 100, 21, center, #efeff7)
    line(album, body, p0_1, y + 63, 100, 20, center, #78787c)
    rect(p0_0, p0_2, 220, 3, #2b2b2c)
    rect(p0_0, p0_2, (220 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #84aace)
    text(elapsed, small, p0_0, p0_3, 220, 14, left, #a7a7ad)
    text(remaining, small, p0_0, p0_3, 220, 14, right, #78787c)
} else {
    let p0_0 = x - 26
    let p0_1 = x - 19
    let p0_2 = y + 267
    let p0_3 = y + 272
    line(artist, body, p0_1, y + 160, 100, 21, center, #a7a7ad)
    line(song, title, p0_1, y + 184, 100, 21, center, #efeff7)
    line(album, body, p0_1, y + 209, 100, 20, center, #78787c)
    rect(p0_0, p0_2, 220, 3, #2b2b2c)
    rect(p0_0, p0_2, (220 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #84aace)
    text(elapsed, small, p0_0, p0_3, 220, 14, left, #a7a7ad)
    text(remaining, small, p0_0, p0_3, 220, 14, right, #78787c)
}
if 1 {
    let at_x = width > height ? x + 93 : x - 27
    let at_y = width > height ? y + 53 : y + 199
    repeat copy_1 from 0 to 10 {
        let cy_1 = at_y + copy_1 * -5
        let beat_copy_1 = 0
        if playing {
            beat_copy_1 = -100
            repeat back_copy_1 from 0 to 3 {
                let f = tick - back_copy_1
                let v = f * 0x9E3779B1 + copy_1 * 0x85EBCA6B
                v = v ^ (v >>> 15)
                v = v * 0x2C1B3C6D
                v = v ^ (v >>> 12)
                let phase = (f >>> 1) % 3 * 2 + (f & 1)
                let pulse = phase == 0 ? 3 : phase == 1 ? 1 : 0
                beat_copy_1 = max(beat_copy_1, 5 - 4 * copy_1 / 10 + (copy_1 < 10 / 2 ? pulse : 0) + (v >>> 30) - ((v >>> 28) & 3) / 2 - 2 * back_copy_1)
            }
            beat_copy_1 = min(max(beat_copy_1, 0), 8)
        }
        if 1 {
            let gy_2 = cy_1 + 35
            repeat copy_2 from 0 to 8 {
                let cy_2 = gy_2 + copy_2 * -5
                rect(at_x, cy_2, 7, 3, (copy_2 < (beat_copy_1 * 125) * 8 / 1000 ? #84aace : #2b2b2c))
            }
        }
    }
}
if width > height {
    format(small, x + 95, y + 103, 105, 14, left, #a7a7ad)
} else {
    format(small, x - 25, y + 249, 105, 14, left, #a7a7ad)
}
