name = "Brick"
author = "EchoPod"
description = "A green backlit screen from the brick-phone days: chunky pixels, bars for the volume and a snake for the song."
selection = "selection"

[spacing]
row_height = 24
padding = 10
scrollbar_width = 4
scrollbar_inset = 2
detail_gap = 8

[colors]
background = "#c7f0d8"
text = "#43523d"
text_secondary = "#43523d"
text_tertiary = "#6f8a6c"
selection_background = "#43523d"
selection_top = "#43523d"
selection_shine = "#43523d"
selection_text = "#c7f0d8"
header_background = "#c7f0d8"
header_top = "#c7f0d8"
header_text = "#43523d"
divider = "#9fc4ad"
scrollbar_thumb = "#43523d"
danger = "#43523d"
success = "#43523d"
chevron = "#43523d"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"
inset = [4, 1]

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"
inset = [4, 1]

[boxes.selection_outline]
fill = "background"
ink = "text"
border = "selection_background"
border_width = 2
inset = [4, 1]

[boxes.header]
fill = "header_background"
ink = "header_text"
border = "text"
border_width = 2
border_edges = ["bottom"]
inset = [8, 0]

[boxes.toast]
fill = "background"
ink = "text"
border = "text"
border_width = 2

[boxes.section]
fill = "background"
ink = "text"
border = "text"
border_width = 2

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"

[boxes.progress_track]
fill = "divider"

[boxes.progress_fill]
fill = "text"

[boxes.progress_active]
fill = "text"

[wallpaper]
palette = ["#c7f0d8", "#bde6ce"]
rows = [
    "111111",
    "100100",
    "100100",
    "111111",
    "100100",
    "100100",
]

[now_playing_scene]
script = '''
const BG = #c7f0d8
const GRID = #bde6ce
const INK = #43523d
const MID = #6f8a6c
const OFF = #a9d3ba

let wide = width > height
rect(x, y, width, height, BG)
lattice(x, y, width, height, 3, GRID)

let bars = (volume * 5 + 31) / 32
repeat bar from 0 to 5 {
    rect(x + 6, y + 44 - bar * 9, 4 + bar * 3, 6, bar < bars ? INK : OFF)
}

let top = wide ? y : y + 104
if !wide {
    let minutes = min(shown / 60000, 99)
    let seconds = (shown / 1000) % 60
    let tens = minutes >= 10
    let dw = 26
    let span = (tens ? 4 : 3) * (dw + 8) + 10
    let dx = x + (width - span) / 2
    segment_style(dw, 44, 6, 0, INK, OFF)
    if tens {
        digit(dx, y + 34, segments(minutes / 10))
        dx = dx + dw + 8
    }
    digit(dx, y + 34, segments(minutes % 10))
    colon(dx + dw + 4, y + 34, 1)
    digit(dx + dw + 18, y + 34, segments(seconds / 10))
    digit(dx + 2 * dw + 26, y + 34, segments(seconds % 10))
}

let tx = x + 30
let tw = width - 60
line(song, title, tx, top + 14, tw, 20, center, INK)
if present(feedback) {
    text(feedback, body, tx, top + 40, tw, 20, center, INK)
} else if present(lyric) {
    line(lyric, body, tx, top + 40, tw, 20, center, INK)
} else {
    line(artist, body, tx, top + 40, tw, 20, center, INK)
}
if paused {
    text("Paused", small, tx, top + 64, tw, 12, center, (now / 500) % 2 ? INK : MID)
} else {
    line(album, small, tx, top + 64, tw, 12, center, MID)
}

let cells = (width - 24) / 10
let sx = x + (width - cells * 10 + 2) / 2
let sy = top + (wide ? 90 : 88)
rect(sx - 5, sy - 5, cells * 10 + 8, 2, INK)
rect(sx - 5, sy + 11, cells * 10 + 8, 2, INK)
rect(sx - 5, sy - 5, 2, 18, INK)
rect(sx + cells * 10 + 1, sy - 5, 2, 18, INK)
let lit = max(3, min(cells, progress(cells) + 1))
repeat cell from 0 to lit {
    rect(sx + cell * 10, sy, 8, 8, INK)
}
let head = sx + (lit - 1) * 10
rect(head + 4, sy + 2, 2, 2, BG)
if lit < cells {
    let fx = sx + (cells - 1) * 10 + 1
    rect(fx + 2, sy, 2, 2, INK)
    rect(fx, sy + 2, 2, 2, INK)
    rect(fx + 4, sy + 2, 2, 2, INK)
    rect(fx + 2, sy + 4, 2, 2, INK)
}
times(body, sx - 5, sy + 18, cells * 10 + 8, 20, INK, INK)
'''

[home_scene]
script = '''
const BG = #c7f0d8
const GRID = #bde6ce
const INK = #43523d
const OFF = #a9d3ba

let wide = width > height
rect(x, y, width, height, BG)
lattice(x, y, width, height, 3, GRID)

let bars = (volume * 5 + 31) / 32
repeat bar from 0 to 5 {
    rect(x + 6, y + 44 - bar * 9, 4 + bar * 3, 6, bar < bars ? INK : OFF)
}

let count = max(items(), 1)
let lane = height - 28
let thumb = max(lane / count, 8)
rect(x + width - 9, y + 14, 2, lane, INK)
rect(x + width - 12, y + 14 + (lane - thumb) * selected() / max(count - 1, 1), 8, thumb, INK)

let nx = x + width - 44
let ny = y + 8
let at = selected()
if at == 0 {
    text("1", title, nx, ny, 28, 20, right, INK)
} else if at == 1 {
    text("2", title, nx, ny, 28, 20, right, INK)
} else if at == 2 {
    text("3", title, nx, ny, 28, 20, right, INK)
} else if at == 3 {
    text("4", title, nx, ny, 28, 20, right, INK)
} else if at == 4 {
    text("5", title, nx, ny, 28, 20, right, INK)
} else {
    text("6", title, nx, ny, 28, 20, right, INK)
}

let top = wide ? y : y + 60
let cx = x + width / 2
text(item(selected()), title, x + 40, top + 12, width - 80, 20, center, INK)
rect(cx - 32, top + 40, 64, 48, INK)
rect(cx - 28, top + 44, 56, 40, BG)
rect(cx - 24, top + 48, 48, 32, INK)
item_icon(selected(), cx - 12, top + 52, 24, 24, BG)
text("Select", body, x + 24, y + height - (wide ? 30 : 70), width - 48, 20, center, INK)
'''

