[home_scene]
script = '''
rect(x, y, width, height, #000400)
if width > height {
    let p0_0 = x + 196
    let p0_1 = y + 6
    let p0_2 = x + 188
    let p0_3 = y + 22
    let p0_4 = y + 130
    menu(x, y, 186, 146)
    rect(p0_2, p0_1, 1, 134, #2d302a)
    lattice(p0_2, p0_1, 1, 134, 2, #000400)
    text("NOW", small, p0_0, p0_1, 60, 14, left, #7e7e75)
    if !(present(song)) {
        text("READY", title, p0_0, p0_3, 118, 20, left, #7e7e75)
    }
    line(song, title, p0_0, p0_3, 118, 20, left, #fcf7e9)
    line(artist, body, p0_0, y + 44, 118, 17, left, #b0aea3)
    if 1 {
        let gx_1 = x + 206
        let gy_1 = y + 66
        repeat copy_1 from 0 to 4 {
            let cx_1 = gx_1 + copy_1 * 24
            let beat_copy_1 = 0
            if playing {
                beat_copy_1 = -100
                repeat back_copy_1 from 0 to 3 {
                    let f = tick - back_copy_1
                    let v = f * 0x9E3779B1 + copy_1 * 0x85EBCA6B
                    v = v ^ (v >>> 15)
                    v = v * 0x2C1B3C6D
                    v = v ^ (v >>> 12)
                    let phase = (f >>> 1) % 3 * 2 + (f & 1)
                    let pulse = phase == 0 ? 3 : phase == 1 ? 1 : 0
                    beat_copy_1 = max(beat_copy_1, 5 - 4 * copy_1 / 4 + (copy_1 < 4 / 2 ? pulse : 0) + (v >>> 30) - ((v >>> 28) & 3) / 2 - 2 * back_copy_1)
                }
                beat_copy_1 = min(max(beat_copy_1, 0), 8)
            }
            rect(cx_1, gy_1 + (33 + -33 * (beat_copy_1 * 125) / 1000), 4, (40 * (18000 + 82 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 6, gy_1 + (35 + -26 * (beat_copy_1 * 125) / 1000), 4, (40 * (12000 + 66 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 12, gy_1 + (34 + -30 * (beat_copy_1 * 125) / 1000), 4, (40 * (14000 + 76 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 18, gy_1 + (37 + -22 * (beat_copy_1 * 125) / 1000), 4, (40 * (8000 + 54 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
        }
    }
    text(elapsed, small, p0_0, y + 112, 118, 14, left, #b0aea3)
    rect(p0_0, p0_4, 118, 4, #2d302a)
    rect(p0_0, p0_4, (118 * progress(1000) / 1000), 4, #fcf7e9)
} else {
    let p0_0 = x + 8
    let p0_1 = y + 164
    let p0_2 = y + 186
    let p0_3 = x + 84
    let p0_4 = y + 265
    menu(x, y, 170, 160)
    rect(p0_0, p0_1, 154, 1, #2d302a)
    lattice(p0_0, p0_1, 154, 1, 2, #000400)
    text("NOW", small, p0_0, y + 170, 60, 14, left, #7e7e75)
    if !(present(song)) {
        text("READY", title, p0_0, p0_2, 154, 20, left, #7e7e75)
    }
    line(song, title, p0_0, p0_2, 154, 20, left, #fcf7e9)
    line(artist, body, p0_0, y + 208, 154, 17, left, #b0aea3)
    if 1 {
        let gx_1 = x + 14
        let gy_1 = y + 228
        repeat copy_1 from 0 to 6 {
            let cx_1 = gx_1 + copy_1 * 24
            let beat_copy_1 = 0
            if playing {
                beat_copy_1 = -100
                repeat back_copy_1 from 0 to 3 {
                    let f = tick - back_copy_1
                    let v = f * 0x9E3779B1 + copy_1 * 0x85EBCA6B
                    v = v ^ (v >>> 15)
                    v = v * 0x2C1B3C6D
                    v = v ^ (v >>> 12)
                    let phase = (f >>> 1) % 3 * 2 + (f & 1)
                    let pulse = phase == 0 ? 3 : phase == 1 ? 1 : 0
                    beat_copy_1 = max(beat_copy_1, 5 - 4 * copy_1 / 6 + (copy_1 < 6 / 2 ? pulse : 0) + (v >>> 30) - ((v >>> 28) & 3) / 2 - 2 * back_copy_1)
                }
                beat_copy_1 = min(max(beat_copy_1, 0), 8)
            }
            rect(cx_1, gy_1 + (21 + -21 * (beat_copy_1 * 125) / 1000), 4, (26 * (18000 + 82 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 6, gy_1 + (23 + -17 * (beat_copy_1 * 125) / 1000), 4, (26 * (12000 + 66 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 12, gy_1 + (22 + -19 * (beat_copy_1 * 125) / 1000), 4, (26 * (14000 + 76 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
            rect(cx_1 + 18, gy_1 + (24 + -14 * (beat_copy_1 * 125) / 1000), 4, (26 * (8000 + 54 * (beat_copy_1 * 125)) / 100000), #fcf7e9)
        }
    }
    text(elapsed, small, p0_0, y + 260, 70, 14, left, #b0aea3)
    rect(p0_3, p0_4, 78, 4, #2d302a)
    rect(p0_3, p0_4, (78 * progress(1000) / 1000), 4, #fcf7e9)
}
