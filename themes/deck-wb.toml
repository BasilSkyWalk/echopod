# Fonts: I drew them, or they came with EchoPod
name = "Deck WB"
author = "Salehin"
description = "just black and white wit album art"
selection = "selection"

[spacing]
row_height = 24

[colors]
background = "#000400"
text = "#fcf7e9"
text_secondary = "#b0aea3"
text_tertiary = "#7e7e75"
selection_background = "#fcf4e2"
selection_top = "#fcf6e6"
selection_shine = "#fdf8ec"
selection_text = "#000000"
header_background = "#141713"
header_top = "#282b25"
header_text = "#fcf7e9"
divider = "#2d302a"
scrollbar_thumb = "#4c4d46"
danger = "#e5484d"
success = "#30a46c"
chevron = "#717169"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "background"
border = "text"
border_width = 1
border_edges = "all"
ink = "text"

[boxes.section]
fill = "background"
border = "text"
border_width = 1
border_edges = "all"
ink = "text"

[boxes.scrollbar_thumb]
fill = "text_tertiary"
ink = "text"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

