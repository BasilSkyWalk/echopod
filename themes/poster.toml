[now_playing_scene]
script = '''
rect(x, y, width, height, #0a0b10)
if width > height {
    let p0_0 = x + 14
    let p0_1 = x + 174
    let p0_2 = y + 122
    let p0_3 = x + 52
    let p0_4 = y + 128
    if has_cover {
        cover(p0_1, y, 146)
    } else {
        rect(p0_1, y, 146, 146, #262836)
    }
    lattice(p0_1, y, 3, 146, 2, #0a0b10)
    lattice(p0_1, y, 10, 146, 2, #0a0b10)
    line(artist, small, p0_0, y + 20, 150, 16, left, #9a9cab)
    line(song, title, p0_0, y + 36, 150, 24, left, #f5f5f7)
    line(album, small, p0_0, y + 62, 150, 16, left, #62657a)
    format(small, p0_0, y + 80, 150, 16, left, #62657a)
    icon(playing ? play : pause, p0_0, y + 104, 12, 12, #f5f5f7)
    text(elapsed, small, p0_0, p0_2, 34, 14, left, #f5f5f7)
    rect(p0_3, p0_4, 70, 2, #262836)
    rect(p0_3, p0_4, (70 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #f5f5f7)
    text(remaining, small, x + 124, p0_2, 40, 14, right, #9a9cab)
} else {
    let p0_0 = x + 12
    let p0_1 = y + 256
    let p0_2 = x + 50
    let p0_3 = y + 262
    if has_cover {
        cover(x, y, 170)
    } else {
        rect(x, y, 170, 170, #262836)
    }
    lattice(x, y + 160, 170, 10, 2, #0a0b10)
    lattice(x, y + 167, 170, 3, 2, #0a0b10)
    line(artist, small, p0_0, y + 174, 146, 16, left, #9a9cab)
    line(song, title, p0_0, y + 190, 146, 24, left, #f5f5f7)
    line(album, small, p0_0, y + 214, 146, 16, left, #62657a)
    format(small, p0_0, y + 232, 146, 16, left, #62657a)
    text(elapsed, small, p0_0, p0_1, 34, 14, left, #f5f5f7)
    rect(p0_2, p0_3, 70, 2, #262836)
    rect(p0_2, p0_3, (70 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #f5f5f7)
    text(remaining, small, x + 122, p0_1, 36, 14, right, #9a9cab)
}
'''
