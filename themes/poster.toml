name = "Poster"
author = "EchoPod"
description = "Quiet and dark, with the cover as big as the screen allows, fading into the page"
selection = "selection"

[spacing]
row_height = 26

[colors]
background = "#0a0b10"
text = "#f5f5f7"
text_secondary = "#9a9cab"
text_tertiary = "#62657a"
selection_background = "#1b1d27"
selection_top = "#1b1d27"
selection_shine = "#f5f5f7"
selection_text = "#ffffff"
header_background = "#0a0b10"
header_top = "#0a0b10"
header_text = "#9a9cab"
divider = "#262836"
scrollbar_thumb = "#3a3d4c"
danger = "#ff7a6b"
success = "#7ee0a0"
chevron = "#62657a"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"
border = "selection_shine"
border_width = 2
border_edges = ["left"]

[boxes.header]
fill = "header_background"
ink = "header_text"

[boxes.toast]
fill = "selection_background"
ink = "text"
radius = 6

[boxes.section]
fill = "selection_background"
ink = "text"
radius = 8

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "text"
radius = 1

[home_scene]
script = '''
rect(x, y, width, height, #0a0b10)
if width > height {
    let p0_0 = x + 180
    if has_cover {
        cover(p0_0, y, 140)
    } else {
        rect(p0_0, y, 140, 140, #262836)
    }
    lattice(p0_0, y, 3, 146, 2, #0a0b10)
    lattice(p0_0, y, 10, 146, 2, #0a0b10)
    menu(x, y, 184, 146)
} else {
    let p0_0 = x + 19
    let p0_1 = y + 148
    if has_cover {
        cover(p0_0, p0_1, 132)
    } else {
        rect(p0_0, p0_1, 132, 132, #262836)
    }
    lattice(p0_0, p0_1, 132, 3, 2, #0a0b10)
    lattice(p0_0, p0_1, 132, 10, 2, #0a0b10)
    menu(x, y, 170, 150)
}
'''
