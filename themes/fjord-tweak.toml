name = "Fjord tweak"
author = "hejichs"
description = "fjord adjusted"
selection = "selection"

[colors]
background = "#182029"
text = "#efeff7"
text_secondary = "#adb6c6"
text_tertiary = "#848ea5"
selection_background = "#84aace"
selection_top = "#9cc3e7"
selection_shine = "#e7f3ff"
selection_text = "#182029"
header_background = "#212c39"
header_top = "#313c4a"
header_text = "#efeff7"
divider = "#424d63"
scrollbar_thumb = "#6b7994"
danger = "#f77973"
success = "#8cd3a5"
chevron = "#7b8aa5"

[boxes.selection]
fill = ["selection_top", "selection_background"]
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = ["header_top", "header_background"]
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 108
    let p0_1 = x + 201
    let p0_2 = y + 8
    let p0_3 = y + 127
    let p0_4 = y + 132
    let p0_5 = y + 103
    menu(x, y, 103, 146)
    rect(x + 104, y, 216, 146, #030b11)
    rect(x + 176, y, 1, 146, #424d63)
    if has_cover {
        cover(p0_1, p0_2, 112)
        reflect(p0_1, p0_2, 112, 26)
    } else {
        rect(p0_1, p0_2, 112, 112, #08080a)
    }
    rect(p0_0, p0_3, 209, 2, #424d63)
    rect(p0_0, p0_3, (209 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #84aace)
    text(elapsed, small, p0_0, p0_4, 150, 14, left, #adb6c6)
    text(remaining, small, x + 167, p0_4, 150, 14, right, #848ea5)
    if present(lyric) {
        line(lyric, small, p0_0, p0_5, 89, 17, center, #ffffff)
    } else {
        line(artist, small, p0_0, p0_5, 89, 17, center, #ffffff)
    }
    line(song, title, p0_0, y + 17, 89, 17, center, #efeff7)
    line(artist, body, p0_0, y + 40, 89, 18, center, #adb6c6)
    line(album, body, p0_0, y + 63, 89, 21, left, #848ea5)
} else {
    let p0_0 = x + 3
    let p0_1 = x + 76
    let p0_2 = y + 152
    let p0_3 = y + 146
    let p0_4 = y + 246
    let p0_5 = y + 250
    menu(x, y, 170, 146)
    rect(x, p0_3, 170, 115, #030b11)
    rect(x, p0_3, 170, 1, #424d63)
    if has_cover {
        cover(p0_1, p0_2, 88)
        reflect(p0_1, p0_2, 88, 21)
    } else {
        rect(p0_1, p0_2, 88, 88, #08080a)
    }
    rect(p0_0, p0_4, 164, 2, #424d63)
    rect(p0_0, p0_4, (164 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #84aace)
    text(elapsed, small, p0_0, p0_5, 118, 11, left, #adb6c6)
    text(remaining, small, x + 50, p0_5, 118, 11, right, #848ea5)
    if present(lyric) {
        line(lyric, small, p0_0, y + 227, 70, 13, center, #ffffff)
    } else {
        line(artist, small, p0_0, y + 227, 70, 13, center, #ffffff)
    }
    line(song, title, p0_0, y + 159, 70, 13, center, #efeff7)
    line(artist, body, p0_0, y + 177, 70, 14, center, #adb6c6)
    line(album, body, p0_0, y + 196, 70, 17, left, #848ea5)
}
'''
