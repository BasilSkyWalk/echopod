\":108,\"y\":40,\"w\":89,\"h\":18,\"align\":\"center\"},\"tall\":{\"x\":3,\"y\":177,\"w\":70,\"h\":14,\"align\":\"center\"}},\"bind\":{},\"source\":\"artist\",\"custom\":\"Hello\",\"size\":\"medium\",\"align\":\"left\",\"color\":\"@text_secondary\",\"scroll\":true},{\"id\":148,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":108,\"y\":63,\"w\":89,\"h\":21},\"tall\":{\"x\":3,\"y\":196,\"w\":70,\"h\":17}},\"bind\":{},\"source\":\"album\",\"custom\":\"Hello\",\"size\":\"medium\",\"align\":\"left\",\"color\":\"@text_tertiary\",\"scroll\":true}],\"upright\":\"auto\"}"

