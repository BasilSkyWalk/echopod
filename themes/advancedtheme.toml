name = "advancedtheme"
author = "hejichs"
description = "theme made for my own needs, you can try it yourself"
selection = "selection"

[colors]
background = "#000000"
text = "#f7f3f7"
text_secondary = "#adaaad"
text_tertiary = "#7c7a7c"
selection_background = "#001e94"
selection_top = "#2640a4"
selection_shine = "#596db9"
selection_text = "#ffffff"
header_background = "#141314"
header_top = "#282728"
header_text = "#f7f3f7"
divider = "#2c2c2c"
scrollbar_thumb = "#4a494a"
danger = "#e5484d"
success = "#30a46c"
chevron = "#6f6d6f"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"
opacity = 27

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "header_background"
ink = "header_text"
opacity = 60

[boxes.toast]
fill = "header_background"
ink = "header_text"
opacity = 47

[boxes.section]
fill = "header_background"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

