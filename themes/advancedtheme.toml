[home_scene]
script = '''
if width > height {
    let p0_0 = x + 9
    let p0_1 = x + 248
    let p0_2 = y + 59
    if 1 {
        clip(x, y, 320, 146)
        let p1_0 = x + 248
        let p1_1 = y + 59
        backdrop(x, y, 320, 146)
        if has_cover {
            cover(p1_0, p1_1, 61)
            reflect(p1_0, p1_1, 61, 17)
        } else {
            rect(p1_0, p1_1, 61, 61, #08080a)
        }
        unclip()
    }
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 1 - 0) * 1
        repeat copy_1 from first_1 to min(items(), first_1 + 1) {
            let p1_0 = y + 9
            item_icon(copy_1, x + 285, p1_0, 24, 24, #ffffff)
            line(item(copy_1), small, x + 158, p1_0, 121, 16, right, #ffffff)
        }
    }
    if has_cover {
        cover(p0_1, p0_2, 61)
        reflect(p0_1, p0_2, 61, 54)
    } else {
        rect(p0_1, p0_2, 61, 61, #08080a)
    }
    line(song, title, p0_0, y + 3, 180, 22, left, #f7f3f7)
    line(artist, body, p0_0, y + 25, 180, 20, left, #f7f3f7)
    line(album, body, p0_0, y + 45, 180, 20, left, #f7f3f7)
    format(small, p0_0, y + 65, 180, 16, left, #adaaad)
    if 1 {
        let gx_1 = x + 9
        let gy_1 = y + 117
        rect(gx_1, gy_1, 180, 3, #2c2c2c)
        rect(gx_1, gy_1, (180 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #001e94)
        text(elapsed, small, gx_1, gy_1 + 5, 180, 14, left, #f7f3f7)
        text(remaining, small, gx_1, gy_1 + 4, 180, 14, right, #f7f3f7)
    }
} else {
    let p0_0 = y + 11
    let p0_1 = x + 12
    let p0_2 = x + 91
    if 1 {
        clip(x, y, 170, 281)
        let p1_0 = x - 78
        let p1_1 = y - 260
        backdrop(x + 75, y + 291, 170, 280)
        if has_cover {
            cover(p1_0, p1_1, 250)
            reflect(p1_0, p1_1, 250, 354)
        } else {
            rect(p1_0, p1_1, 250, 250, #08080a)
        }
        unclip()
    }
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 1 - 0) * 1
        repeat copy_1 from first_1 to min(items(), first_1 + 1) {
            item_icon(copy_1, x + 37, y + 200, 24, 24, #ffffff)
            line(item(copy_1), small, x + 19, y + 245, 61, 16, left, #ffffff)
        }
    }
    if has_cover {
        cover(p0_2, p0_0, 73)
        reflect(p0_2, p0_0, 73, 25)
    } else {
        rect(p0_2, p0_0, 73, 73, #08080a)
    }
    line(song, title, p0_1, p0_0, 73, 23, left, #f7f3f7)
    line(artist, body, p0_1, y + 34, 73, 20, left, #f7f3f7)
    line(album, body, p0_1, y + 54, 73, 25, left, #f7f3f7)
    format(small, p0_1, y + 85, 49, 15, left, #adaaad)
    if 1 {
        let gx_1 = x + 91
        let gy_1 = y + 109
        let p1_0 = gy_1 + 5
        rect(gx_1, gy_1, 73, 3, #2c2c2c)
        rect(gx_1, gy_1 + 1, (73 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #001e94)
        text(elapsed, small, gx_1, p1_0, 73, 14, left, #f7f3f7)
        text(remaining, small, gx_1, p1_0, 73, 14, right, #f7f3f7)
    }
}
