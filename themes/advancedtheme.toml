[now_playing_scene]
script = '''
if width > height {
    let p0_0 = x + 10
    let p0_1 = y + 8
    let p0_2 = y + 88
    let p0_3 = x + 160
    let p0_4 = y + 128
    let p0_5 = y + 132
    if 1 {
        clip(x, y, 347, 400)
        let p1_0 = y - 415
        if has_cover {
            cover(x, p1_0, 347)
            reflect(x, p1_0, 347, 177)
        } else {
            rect(x, p1_0, 347, 347, #2c2c2c)
        }
        unclip()
    }
    if has_cover {
        cover(p0_0, p0_1, 55)
        reflect(p0_0, p0_1, 55, 25)
    } else {
        rect(p0_0, p0_1, 55, 55, #2c2c2c)
    }
    text(song, title, p0_0, p0_2, 146, 23, left, #90b1c9)
    if present(feedback) {
        line(feedback, body, p0_0, y + 110, 146, 18, left, #adaaad)
    }
    if !(present(feedback)) {
        line(artist, body, p0_0, y + 108, 146, 19, left, #90b1c9)
    }
    line(album, body, p0_3, p0_2, 160, 20, left, #90b1c9)
    format(small, p0_3, y + 111, 180, 16, left, #adaaad)
    rect(p0_0, p0_4, 300, 3, #2c2c2c)
    rect(p0_0, p0_4, (300 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #001e94)
    text(elapsed, small, p0_0, p0_5, 300, 14, left, #adaaad)
    text(remaining, small, p0_0, p0_5, 300, 14, right, #7c7a7c)
    if present(lyric) {
        line(lyric, body, x + 70, y + 42, 250, 21, left, #bdffe2)
    } else {
        line(artist, body, x + 70, y + 42, 250, 21, left, #bdffe2)
    }
} else {
    let p0_0 = x + 8
    let p0_1 = y + 17
    let p0_2 = x + 5
    let p0_3 = y + 249
    let p0_4 = y + 258
    let p0_5 = y + 213
    if 1 {
        clip(x, y, 170, 280)
        let p1_0 = x - 106
        let p1_1 = y - 309
        if has_cover {
            cover(p1_0, p1_1, 298)
            reflect(p1_0, p1_1, 298, 304)
        } else {
            rect(p1_0, p1_1, 298, 298, #2c2c2c)
        }
        unclip()
    }
    if has_cover {
        cover(p0_0, p0_1, 56)
        reflect(p0_0, p0_1, 56, 94)
    } else {
        rect(p0_0, p0_1, 56, 56, #2c2c2c)
    }
    text(song, title, p0_2, y + 92, 157, 28, left, #90b1c9)
    if present(feedback) {
        line(feedback, body, p0_2, y + 120, 157, 25, center, #adaaad)
    }
    if !(present(feedback)) {
        line(artist, body, p0_2, y + 119, 157, 26, left, #90b1c9)
    }
    line(album, body, p0_0, y + 145, 154, 22, left, #90b1c9)
    format(small, x + 7, y + 183, 157, 15, left, #adaaad)
    rect(p0_0, p0_3, 154, 3, #2c2c2c)
    rect(p0_0, p0_3, (154 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #001e94)
    text(elapsed, small, p0_0, p0_4, 154, 14, left, #adaaad)
    text(remaining, small, p0_0, p0_4, 154, 14, right, #7c7a7c)
    if present(lyric) {
        line(lyric, body, x, p0_5, 170, 23, left, #bdffe2)
    } else {
        line(artist, body, x, p0_5, 170, 23, left, #bdffe2)
    }
}
