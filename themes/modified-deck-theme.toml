# Fonts: I drew them, or they came with EchoPod
name = "Modified Deck theme"
author = "Pxroku"
description = "Modified Deck theme"
selection = "selection"
cover_flow = "dark"

[spacing]
row_height = 24

[colors]
background = "#000000"
text = "#ffffff"
text_secondary = "#b3b3b3"
text_tertiary = "#808080"
selection_background = "#9a9a9a"
selection_top = "#000000"
selection_shine = "#bdbdbd"
selection_text = "#000000"
header_background = "#141414"
header_top = "#292929"
header_text = "#ffffff"
divider = "#2e2e2e"
scrollbar_thumb = "#4d4d4d"
danger = "#e5484d"
success = "#30a46c"
chevron = "#737373"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "background"
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "background"
border = "text"
border_width = 1
border_edges = "all"
ink = "text"

[boxes.section]
fill = "background"
border = "text"
border_width = 1
border_edges = "all"
ink = "text"

[boxes.scrollbar_thumb]
fill = "text_tertiary"
ink = "text"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

