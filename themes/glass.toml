:\"left\",\"color\":\"#97a4ff\",\"scroll\":true},{\"id\":53,\"kind\":\"symbol\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":134,\"y\":80,\"w\":14,\"h\":14},\"tall\":{\"x\":36,\"y\":212,\"w\":14,\"h\":14}},\"bind\":{},\"mark\":\"previous\",\"color\":\"#ffffff\"},{\"id\":54,\"kind\":\"box\",\"name\":\"Play button\",\"hidden\":false,\"at\":{\"wide\":{\"x\":156,\"y\":72,\"w\":56,\"h\":30},\"tall\":{\"x\":57,\"y\":204,\"w\":56,\"h\":30}},\"bind\":{},\"fill\":\"solid\",\"color\":\"#3a47cf\",\"top\":\"@header_top\",\"bottom\":\"@header_background\",\"radius\":14,\"border\":0,\"borderColor\":\"@divider\",\"taper\":0,\"grid\":0,\"gridColor\":\"@background\"},{\"id\":55,\"kind\":\"symbol\",\"name\":\"Pause\",\"hidden\":false,\"at\":{\"wide\":{\"x\":175,\"y\":78,\"w\":18,\"h\":18},\"tall\":{\"x\":76,\"y\":210,\"w\":18,\"h\":18}},\"bind\":{\"show\":{\"when\":{\"on\":\"playing\"}}},\"mark\":\"pause\",\"color\":\"#ffffff\"},{\"id\":56,\"kind\":\"symbol\",\"name\":\"Play\",\"hidden\":false,\"at\":{\"wide\":{\"x\":175,\"y\":78,\"w\":18,\"h\":18},\"tall\":{\"x\":76,\"y\":210,\"w\":18,\"h\":18}},\"bind\":{\"show\":{\"when\":{\"on\":\"playing\",\"not\":true}}},\"mark\":\"play\",\"color\":\"#ffffff\"},{\"id\":57,\"kind\":\"symbol\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":220,\"y\":80,\"w\":14,\"h\":14},\"tall\":{\"x\":120,\"y\":212,\"w\":14,\"h\":14}},\"bind\":{},\"mark\":\"next\",\"color\":\"#ffffff\"},{\"id\":58,\"kind\":\"box\",\"name\":\"Rule\",\"hidden\":false,\"at\":{\"wide\":{\"x\":126,\"y\":108,\"w\":186,\"h\":1},\"tall\":null},\"bind\":{},\"fill\":\"solid\",\"color\":\"#4c58d6\",\"top\":\"@header_top\",\"bottom\":\"@header_background\",\"radius\":0,\"border\":0,\"borderColor\":\"@divider\",\"taper\":0,\"grid\":0,\"gridColor\":\"@background\"},{\"id\":59,\"kind\":\"box\",\"name\":\"Track\",\"hidden\":false,\"at\":{\"wide\":{\"x\":16,\"y\":120,\"w\":288,\"h\":4},\"tall\":{\"x\":14,\"y\":246,\"w\":142,\"h\":4}},\"bind\":{},\"fill\":\"solid\",\"color\":\"