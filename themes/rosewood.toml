name = "Rosewood"
author = "EchoPod"
description = "Deep burgundy with a rounded selection"
selection = "selection"

[spacing]
row_height = 26

[colors]
background = "#1c0f14"
text = "#f6e6e0"
text_secondary = "#cfa8a4"
text_tertiary = "#96706e"
selection_background = "#7a2338"
selection_top = "#a83250"
selection_shine = "#d06a80"
selection_text = "#fff4f0"
header_background = "#241218"
header_top = "#3a1a26"
header_text = "#f6e6e0"
divider = "#4a2430"
scrollbar_thumb = "#8a4a58"
danger = "#ff7a5c"
success = "#9bd4a0"
chevron = "#a07078"

[boxes.selection]
fill = ["selection_top", "selection_background"]
ink = "selection_text"
inset = [4, 2]
radius = 11

[boxes.toast]
fill = "header_top"
border = "selection_top"
border_width = 1
ink = "header_text"
radius = 10

[boxes.section]
fill = "header_top"
border = "selection_top"
border_width = 1
ink = "header_text"
radius = 12

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
radius = 1

[boxes.progress_fill]
fill = "selection_shine"

[boxes.progress_active]
fill = "selection_text"

