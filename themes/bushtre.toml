[now_playing_scene]
script = '''
rect(x, y, width, height, #000000)
if width > height {
    let p0_0 = x + 10
    let p0_1 = x + 132
    let p0_2 = y + 8
    let p0_3 = y + 128
    let p0_4 = y + 132
    if has_cover {
        cover(p0_0, p0_2, 112)
    } else {
        rect(p0_0, p0_2, 112, 112, #262429)
    }
    line(song, title, p0_1, p0_2, 180, 22, left, #d2c8e1)
    if present(feedback) {
        line(feedback, body, p0_1, y + 32, 180, 20, left, #d2c8ff)
    }
    if !(present(feedback)) {
        line(album, body, p0_1, y + 58, 180, 20, left, #d2c8ff)
    }
    line(artist, body, p0_1, y + 30, 180, 20, left, #696471)
    rect(p0_0, p0_3, 300, 3, #262429)
    rect(p0_0, p0_3, (300 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #6e00ff)
    text(elapsed, small, p0_0, p0_4, 300, 14, left, #d2c8ff)
    text(remaining, small, p0_0, p0_4, 300, 14, right, #696471)
} else {
    let p0_0 = x + 8
    let p0_1 = x + 31
    let p0_2 = y + 8
    let p0_3 = y + 249
    let p0_4 = y + 258
    if has_cover {
        cover(p0_1, p0_2, 109)
    } else {
        rect(p0_1, p0_2, 109, 109, #262429)
    }
    line(song, title, p0_0, y + 123, 154, 22, center, #d2c8e1)
    if present(feedback) {
        line(feedback, body, p0_0, y + 153, 154, 20, center, #d2c8ff)
    }
    if !(present(feedback)) {
        line(album, body, p0_0, y + 179, 154, 20, center, #d2c8ff)
    }
    line(artist, body, p0_0, y + 151, 154, 20, center, #696471)
    rect(p0_0, p0_3, 154, 3, #262429)
    rect(p0_0, p0_3, (154 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #6e00ff)
    text(elapsed, small, p0_0, p0_4, 154, 14, left, #d2c8ff)
    text(remaining, small, p0_0, p0_4, 154, 14, right, #696471)
}
if 1 {
    let at_x = width > height ? x + 132 : x - 4
    let at_y = width > height ? y + 82 : y + 205
    repeat copy_1 from 0 to 20 {
        let cx_1 = at_x + copy_1 * 9
        let beat_copy_1 = 0
        if playing {
            beat_copy_1 = -100
            repeat back_copy_1 from 0 to 3 {
                let f = tick - back_copy_1
                let v = f * 0x9E3779B1 + copy_1 * 0x85EBCA6B
                v = v ^ (v >>> 15)
                v = v * 0x2C1B3C6D
                v = v ^ (v >>> 12)
                let phase = (f >>> 1) % 3 * 2 + (f & 1)
                let pulse = phase == 0 ? 3 : phase == 1 ? 1 : 0
                beat_copy_1 = max(beat_copy_1, 5 - 4 * copy_1 / 20 + (copy_1 < 20 / 2 ? pulse : 0) + (v >>> 30) - ((v >>> 28) & 3) / 2 - 2 * back_copy_1)
            }
            beat_copy_1 = min(max(beat_copy_1, 0), 8)
        }
        if 1 {
            let gy_2 = at_y + 35
            repeat copy_2 from 0 to 8 {
                let cy_2 = gy_2 + copy_2 * -5
                rect(cx_1, cy_2, 7, 3, (copy_2 < (beat_copy_1 * 125) * 8 / 1000 ? #6e00ff : #262429))
            }
        }
    }
}
