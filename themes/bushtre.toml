# Fonts: From a font with an open licence, like the SIL Open Font License
name = "Bushtre"
author = "Bush_King"
description = "purple neon theme to fit my desktop music setup"
selection = "selection_outline"

[colors]
background = "#000000"
text = "#d2c8e1"
text_secondary = "#d2c8ff"
text_tertiary = "#696471"
selection_background = "#6e00ff"
selection_top = "#8426ff"
selection_shine = "#a159ff"
selection_text = "#ffffff"
header_background = "#111012"
header_top = "#222024"
header_text = "#d2c8e1"
divider = "#262429"
scrollbar_thumb = "#3f3c44"
danger = "#e5484d"
success = "#30a46c"
chevron = "#5e5a65"

[boxes.selection]
fill = ["selection_top", "selection_background"]
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = ["header_top", "header_background"]
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

