name = "Receipt"
author = "EchoPod"
description = "Every song printed on a till receipt, with a barcode that prints as it plays"
selection = "selection"

[spacing]
row_height = 22

[colors]
background = "#f3efe6"
text = "#1c1b19"
text_secondary = "#4a4743"
text_tertiary = "#8b867c"
selection_background = "#1c1b19"
selection_top = "#1c1b19"
selection_shine = "#1c1b19"
selection_text = "#f3efe6"
header_background = "#f3efe6"
header_top = "#f3efe6"
header_text = "#1c1b19"
divider = "#cfc8b9"
scrollbar_thumb = "#8b867c"
danger = "#b3261e"
success = "#2e7d32"
chevron = "#4a4743"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.header]
fill = "header_background"
ink = "header_text"
border = "text"
border_width = 1
border_edges = ["bottom"]

[boxes.toast]
fill = "background"
ink = "text"
border = "text"
border_width = 1

[boxes.section]
fill = "background"
ink = "text"
border = "text"
border_width = 1

[boxes.scrollbar_thumb]
fill = "text_tertiary"
ink = "text"

