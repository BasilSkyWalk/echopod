[home_scene]
script = '''
rect(x, y, width, height, #33312d)
if width > height {
    rect(x + 36, y, 248, 140, #f3efe6)
    if 1 {
        let gx_1 = x + 36
        let gy_1 = y + 140
        repeat copy_1 from 0 to 31 {
            let cx_1 = gx_1 + copy_1 * 8
            trapezoid(cx_1, gy_1, 8, 5, 4, #f3efe6)
        }
    }
    text("MENU", title, x + 46, y + 3, 228, 18, center, #1c1b19)
    if 1 {
        let gx_1 = x + 46
        let gy_1 = y + 24
        repeat copy_1 from 0 to 38 {
            let cx_1 = gx_1 + copy_1 * 6
            rect(cx_1, gy_1, 3, 1, #1c1b19)
        }
    }
    menu(x + 38, y + 28, 244, 110)
} else {
    rect(x + 6, y, 158, 272, #f3efe6)
    if 1 {
        let gx_1 = x + 6
        let gy_1 = y + 272
        repeat copy_1 from 0 to 20 {
            let cx_1 = gx_1 + copy_1 * 8
            trapezoid(cx_1, gy_1, 8, 5, 4, #f3efe6)
        }
    }
    text("MENU", title, x + 12, y + 6, 146, 18, center, #1c1b19)
    if 1 {
        let gx_1 = x + 12
        let gy_1 = y + 28
        repeat copy_1 from 0 to 25 {
            let cx_1 = gx_1 + copy_1 * 6
            rect(cx_1, gy_1, 3, 1, #1c1b19)
        }
    }
    menu(x + 8, y + 32, 154, 238)
