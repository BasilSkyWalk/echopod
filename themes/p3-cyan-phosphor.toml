    if present(feedback) {
        line(feedback, body, p0_1, p0_3, 180, 20, left, #b3b6b3)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_1, p0_3, 180, 20, left, #b3b6b3)
        } else {
            line(artist, body, p0_1, p0_3, 180, 20, left, #b3b6b3)
        }
    }
    line(album, body, p0_1, y + 54, 180, 20, left, #808680)
    format(small, p0_1, y + 80, 180, 16, left, #b3b6b3)
    rect(p0_0, p0_4, 300, 3, #2e382e)
    rect(p0_0, p0_4, (300 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #42e0ff)
    text(elapsed, small, p0_0, p0_5, 300, 14, left, #b3b6b3)
    text(remaining, small, p0_0, p0_5, 300, 14, right, #808680)
} else {
    let p0_0 = x + 8
    let p0_1 = y + 154
    let p0_2 = x + 29
    let p0_3 = y + 8
    let p0_4 = y + 249
    let p0_5 = y + 258
    if has_cover {
        cover(p0_2, p0_3, 112)
    } else {
        rect(p0_2, p0_3, 112, 112, #2e382e)
    }
    line(song, title, p0_0, y + 126, 154, 22, center, #ffffff)
    if present(feedback) {
        line(feedback, body, p0_0, p0_1, 154, 20, center, #b3b6b3)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_0, p0_1, 154, 20, center, #b3b6b3)
        } else {
            line(artist, body, p0_0, p0_1, 154, 20, center, #b3b6b3)
        }
    }
    line(album, body, p0_0, y + 180, 154, 20, center, #808680)
    format(small, p0_0, y + 206, 154, 16, center, #b3b6b3)
    rect(p0_0, p0_4, 154, 3, #2e382e)
    rect(p0_0, p0_4, (154 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #42e0ff)
    text(elapsed, small, p0_0, p0_5, 154, 14, left, #b3b6b3)
    text(remaining, small, p0_0, p0_5, 154, 14, right, #808680)
}
