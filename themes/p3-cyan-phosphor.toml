# Fonts: I drew them, or they came with EchoPod
name = "P3 Cyan Phosphor"
author = "August Van Zorn and Tiger Chan"
description = "Derived from August Van Zorn's P3 Amber Phosphor"
selection = "selection_flat"

[colors]
background = "#000c00"
text = "#ffffff"
text_secondary = "#b3b6b3"
text_tertiary = "#808680"
selection_background = "#42e0ff"
selection_top = "#5ee5ff"
selection_shine = "#8beafd"
selection_text = "#000000"
header_background = "#141f14"
header_top = "#2a3032"
header_text = "#ffffff"
divider = "#2e382e"
scrollbar_thumb = "#4d554d"
danger = "#e5484d"
success = "#30a46c"
chevron = "#737973"

[boxes.selection]
fill = ["selection_top", "selection_background"]
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = ["header_top", "header_background"]
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

