[now_playing_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 10
    let p0_1 = x + 132
    let p0_2 = y + 8
    let p0_3 = y + 32
    let p0_4 = y + 128
    let p0_5 = y + 132
    if has_cover {
        cover(p0_0, p0_2, 112)
    } else {
        rect(p0_0, p0_2, 112, 112, #843739)
    }
    line(song, title, p0_1, p0_2, 180, 22, left, #17fccd)
    if present(feedback) {
        line(feedback, body, p0_1, p0_3, 180, 20, left, #4bb99d)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_1, p0_3, 180, 20, left, #3ac9ad)
        } else {
            line(artist, body, p0_1, p0_3, 180, 20, left, #3ac9ad)
        }
    }
    text(album, body, p0_1, y + 54, 180, 20, left, #3ac9ad)
    format(small, p0_1, y + 80, 180, 16, left, #4bb99d)
    rect(p0_0, p0_4, 300, 3, #843739)
    rect(p0_0, p0_4, (300 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #17fccd)
    text(elapsed, small, p0_0, p0_5, 300, 14, left, #4bb99d)
    text(remaining, small, p0_0, p0_5, 300, 14, right, #749889)
} else {
    let p0_0 = x + 8
    let p0_1 = y + 154
    let p0_2 = x + 29
    let p0_3 = y + 8
    let p0_4 = y + 249
    let p0_5 = y + 258
    if has_cover {
        cover(p0_2, p0_3, 112)
    } else {
        rect(p0_2, p0_3, 112, 112, #843739)
    }
    line(song, title, p0_0, y + 126, 154, 22, center, #17fccd)
    if present(feedback) {
        line(feedback, body, p0_0, p0_1, 154, 20, left, #4bb99d)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_0, p0_1, 154, 20, left, #3ac9ad)
        } else {
            line(artist, body, p0_0, p0_1, 154, 20, left, #3ac9ad)
        }
    }
    text(album, body, p0_0, y + 180, 154, 20, center, #3ac9ad)
    format(small, p0_0, y + 206, 154, 16, center, #4bb99d)
    rect(p0_0, p0_4, 154, 3, #843739)
    rect(p0_0, p0_4, (154 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #17fccd)
    text(elapsed, small, p0_0, p0_5, 154, 14, left, #4bb99d)
    text(remaining, small, p0_0, p0_5, 154, 14, right, #749889)
}
'''
