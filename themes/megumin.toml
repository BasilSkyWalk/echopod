name = "Megumin"
author = "Mieow"
description = "Megumin"
selection = "selection"

[colors]
background = "#9c0c18"
text = "#17fccd"
text_secondary = "#4bb99d"
text_tertiary = "#749889"
selection_background = "#17fccd"
selection_top = "#3afcd5"
selection_shine = "#68fddf"
selection_text = "#000000"
header_background = "#911f26"
header_top = "#873235"
header_text = "#17fccd"
divider = "#843739"
scrollbar_thumb = "#74544e"
danger = "#ed7f82"
success = "#4db181"
chevron = "#73887b"

[boxes.selection]
fill = "selection_background"
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "background"
border = "background"
border_width = 1
border_edges = []
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

