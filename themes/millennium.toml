name = "Millennium"
author = "EchoPod"
description = "An early-2000s desktop: rolling hills, blue title bars and a taskbar"
selection = "selection"

[spacing]
row_height = 24

[colors]
background = "#ece9d8"
text = "#000000"
text_secondary = "#3b3b3b"
text_tertiary = "#6e6e6e"
selection_background = "#316ac5"
selection_top = "#316ac5"
selection_shine = "#5a8be0"
selection_text = "#ffffff"
header_background = "#0b4ad1"
header_top = "#2a70e0"
header_text = "#ffffff"
divider = "#aca899"
scrollbar_thumb = "#9fb8ee"
danger = "#d9512c"
success = "#2e7d32"
chevron = "#3b3b3b"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.header]
fill = ["header_top", "header_background"]
ink = "header_text"
shine = "selection_shine"
shine_height = 1

[boxes.toast]
fill = "background"
ink = "text"
border = "text"
border_width = 1

[boxes.section]
fill = "selection_background"
ink = "selection_text"
radius = 4

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "text"
radius = 2

[home_scene]
script = '''
if width > height {
    let p0_0 = y + 22
    let p0_1 = y + 4
    let p0_2 = y + 26
    let p0_3 = x + 6
    let p0_4 = y + 128
    let p0_5 = y + 6
    gradient(x, y, width, height, #2c6de0, #a9d0f5)
