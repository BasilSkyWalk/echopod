    rect(p0_2, p0_1, 152, 133, #ece9d8)
    menu(p0_2, p0_1, 152, 133)
    rounded(p0_0, y + 164, 158, 94, 6, #0b4ad1)
    gradient(p0_0, y + 164, 158, 18, #3d8bf0, #0b4ad1)
    text("Now Playing", small, x + 12, y + 166, 112, 14, left, #ffffff)
    if 1 {
        let bx = x + 144
        let by = y + 166
        let bw = 16
        let bh = 14
        rounded(bx, by, bw, bh, 3, #ffffff)
        rounded(bx + 1, by + 1, bw - 2, bh - 2, 2, #d9512c)
    }
    text("x", small, x + 144, y + 165, 16, 14, center, #ffffff)
    rect(p0_2, y + 182, 152, 73, #ece9d8)
    if has_cover {
