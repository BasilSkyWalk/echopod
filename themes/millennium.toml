    ring((x + 121) * 16 + 8, (y + 51) * 16 + 8, 176, 0, #ffffff)
    ring((x + 140) * 16 + 8, (y + 48) * 16 + 8, 224, 0, #ffffff)
    ring((p0_4) * 16 + 8, (y + 316) * 16 + 8, 1920, 0, #5aad38)
