name = "Obsidian"
author = "Unravel.1"
description = "Dark theme"
selection = "selection"

[colors]
background = "#101010"
text = "#f7f3f7"
text_secondary = "#8c8e94"
text_tertiary = "#63616b"
selection_background = "#2161d6"
selection_top = "#5292f7"
selection_shine = "#7baaff"
selection_text = "#101010"
header_background = "#101010"
header_top = "#101010"
header_text = "#f7f3f7"
divider = "#313039"
scrollbar_thumb = "#63616b"
danger = "#ef4d39"
success = "#31c75a"
chevron = "#6b6d73"

[boxes.selection]
fill = ["selection_top", "selection_background"]
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = ["header_top", "header_background"]
border = "divider"
border_width = 1
border_edges = ["bottom"]
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

[now_playing_scene]
script = '''
rect(x, y, width, height, #101010)
if width > height {
    let p0_0 = x + 20
    let p0_1 = x + 112
    let p0_2 = x + 10
    let p0_3 = y + 16
    let p0_4 = y + 110
    rounded(p0_2, y + 6, 300, 91, 5, #000000)
    if has_cover {
        cover(p0_0, p0_3, 72)
    } else {
        rect(p0_0, p0_3, 72, 72, #313039)
    }
    rounded(p0_2, y + 102, 300, 36, 5, #000000)
    rect(p0_0, y + 129, 280, 2, #313039)
    text(remaining, small, x + 220, p0_4, 80, 14, right, #63616b)
    text(elapsed, small, p0_0, p0_4, 80, 14, left, #8c8e94)
    rect(p0_0, y + 130, (280 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 1, #2161d6)
    line(song, title, p0_1, y + 15, 180, 22, left, #f7f3f7)
    line(artist, body, p0_1, y + 37, 180, 20, left, #8c8e94)
    line(album, small, p0_1, y + 57, 180, 20, left, #63616b)
} else {
    let p0_0 = y + 13
    let p0_1 = x - 55
    let p0_2 = x + 60
    let p0_3 = x + 13
    let p0_4 = y + 69
    rounded(x + 8, y + 8, 154, 47, 5, #000000)
    if has_cover {
        cover(p0_3, p0_0, 37)
    } else {
        rect(p0_3, p0_0, 37, 37, #313039)
    }
    rounded(x - 65, y + 61, 300, 36, 5, #000000)
    rect(p0_1, y + 88, 280, 2, #313039)
    text(remaining, small, x + 145, p0_4, 80, 14, right, #63616b)
    text(elapsed, small, p0_1, p0_4, 80, 14, left, #8c8e94)
    rect(p0_1, y + 89, (280 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 1, #2161d6)
    line(song, title, p0_2, p0_0, 92, 11, left, #f7f3f7)
    line(artist, body, p0_2, y + 24, 92, 10, left, #8c8e94)
    line(album, small, p0_2, y + 34, 92, 10, left, #63616b)
}
if 1 {
    let at_x = width > height ? x + 116 : x + 41
    let at_y = width > height ? y + 113 : y + 72
    clip(at_x, at_y, 88, 8)
    repeat copy_1 from 0 to 10 {
        let cx_1 = at_x + copy_1 * 9
        let beat_copy_1 = 0
        if playing {
            beat_copy_1 = -100
            repeat back_copy_1 from 0 to 3 {
                let f = tick - back_copy_1
                let v = f * 0x9E3779B1 + copy_1 * 0x85EBCA6B
                v = v ^ (v >>> 15)
                v = v * 0x2C1B3C6D
                v = v ^ (v >>> 12)
                let phase = (f >>> 1) % 3 * 2 + (f & 1)
                let pulse = phase == 0 ? 3 : phase == 1 ? 1 : 0
                beat_copy_1 = max(beat_copy_1, 5 - 4 * copy_1 / 10 + (copy_1 < 10 / 2 ? pulse : 0) + (v >>> 30) - ((v >>> 28) & 3) / 2 - 2 * back_copy_1)
            }
            beat_copy_1 = min(max(beat_copy_1, 0), 8)
        }
        if 1 {
            let gy_2 = at_y + 35
            repeat copy_2 from 0 to 8 {
                let cy_2 = gy_2 + copy_2 * -5
                rect(cx_1, cy_2, 7, 3, (copy_2 < (beat_copy_1 * 125) * 8 / 1000 ? #2161d6 : #313039))
            }
        }
    }
    unclip()
}
if width > height {
    let p0_0 = y + 79
    line(detail, small, x + 112, p0_0, 120, 10, left, #313039)
    line(feedback, small, x + 232, p0_0, 60, 10, left, #313039)
    if paused {
        let gx_1 = x + 42
        let gy_1 = y + 38
        ring((gx_1 + 14) * 16 + 8, (gy_1 + 14) * 16 + 8, 224, 0, #000000)
        icon(playing ? play : pause, gx_1 + 9, gy_1 + 9, 10, 10, #f7f3f7)
    }
} else {
    let p0_0 = y + 45
    line(detail, small, x + 60, p0_0, 62, 5, left, #313039)
    line(feedback, small, x + 122, p0_0, 31, 5, left, #313039)
    if paused {
        let gx_1 = x + 24
        let gy_1 = y + 24
        ring((gx_1 + 7) * 16 + 8, (gy_1 + 7) * 16 + 8, 112, 0, #000000)
        icon(playing ? play : pause, gx_1 + 5, gy_1 + 5, 5, 5, #f7f3f7)
    }
}
'''
