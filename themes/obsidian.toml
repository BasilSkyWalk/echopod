\"at\":{\"wide\":{\"x\":220,\"y\":110,\"w\":80,\"h\":14,\"align\":\"right\"},\"tall\":{\"x\":145,\"y\":69,\"w\":80,\"h\":14,\"align\":\"right\"}},\"bind\":{},\"source\":\"remaining\",\"custom\":\"Hello\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@text_tertiary\",\"scroll\":false},{\"id\":289,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":20,\"y\":110,\"w\":80,\"h\":14},\"tall\":{\"x\":-55,\"y\":69,\"w\":80,\"h\":14}},\"bind\":{},\"source\":\"elapsed\",\"custom\":\"Hello\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@text_secondary\",\"scroll\":false},{\"id\":288,\"kind\":\"box\",\"name\":\"Progress\",\"hidden\":false,\"at\":{\"wide\":{\"x\":20,\"y\":130,\"w\":280,\"h\":1},\"tall\":{\"x\":-55,\"y\":89,\"w\":280,\"h\":1}},\"bind\":{\"w\":{\"source\":\"progress_volume\",\"from\":0,\"to\":100}},\"fill\":\"solid\",\"color\":\"@selection_background\",\"top\":\"@header_top\",\"bottom\":\"@header_background\",\"radius\":0,\"border\":0,\"borderColor\":\"@divider\",\"taper\":0,\"grid\":0,\"gridColor\":\"@background\"},{\"id\":406,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":112,\"y\":15,\"w\":180,\"h\":22},\"tall\":{\"x\":60,\"y\":13,\"w\":92,\"h\":11}},\"bind\":{},\"source\":\"song\",\"custom\":\"Hello\",\"size\":\"large\",\"align\":\"left\",\"color\":\"@text\",\"scroll\":true},{\"id\":407,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":112,\"y\":37,\"w\":180,\"h\":20},\"tall\":{\"x\":60,\"y\":24,\"w\":92,\"h\":10}},\"bind\":{},\"source\":\"artist\",\"custom\":\"Hello\",\"size\":\"medium\",\"align\":\"left\",\"color\":\"@text_secondary\",\"scroll\":true},{\"id\":408,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":112,\"y\":57,\"w\":180,\"h\":20},\"tall\":{\"x\":60,\"y\":34,\"w\":92,\"h\":10}},\"bind\":{},\"source\":\"album\",\"custom\":\"Hello\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@text_tertiary\",\"scroll\":true},{\"id\":419,\"kind\":\"group\",\"name\":\"Level bars\",\"hidden\":false,\"at\":{\"wide\":{\"x\":116,\"y\":113,\"w\":88,\"h\":8},\"tall\":{\"x\":41,\"y\":72,\"w\":88,\"h\":8}},\"bind\":{},\"children\":[{\"id\":418,\"kind\":\"group\",\"name\":\"Bar\",\"hidden\":false,\"at\":{\"wide\":{\"x\":0,\"y\":35,\"w\":7,\"h\":3},\"tall\":{\"x\":0,\"y\":35,\"w\":7,\"h\":3}},\"bind\":{},\"children\":[{\"id\":417,\"kind\":\"box\",\"name\":\"Cell\",\"hidden\":false,\"at\":{\"wide\":{\"x\":0,\"y\":0,\"w\":7,\"h\":3},\"tall\":{\"x\":0,\"y\":0,\"w\":7,\"h\":3}},\"bind\":{\"color\":{\"when\":{\"on\":\"lit\",\"source\":\"beat\"},\"color\":\"@selection_background\"}},\"fill\":\"solid\",\"color\":\"@divider\",\"top\":\"@header_top\",\"bottom\":\"@header_background\",\"radius\":0,\"border\":0,\"borderColor\":\"@divider\",\"taper\":0,\"grid\":0,\"gridColor\":\"@background\"}],\"clip\":false,\"repeat\":{\"count\":8,\"columns\":1,\"dx\":0,\"dy\":-5,\"turn\":0,\"start\":0,\"spin\":0}}],\"clip\":true,\"repeat\":{\"count\":10,\"columns\":10,\"dx\":9,\"dy\":0,\"turn\":0,\"start\":0,\"spin\":0}},{\"id\":420,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":112,\"y\":79,\"w\":120,\"h\":10},\"tall\":{\"x\":60,\"y\":45,\"w\":62,\"h\":5}},\"bind\":{},\"source\":\"detail\",\"custom\":\"Hello\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@divider\",\"scroll\":true},{\"id\":424,\"kind\":\"text\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":232,\"y\":79,\"w\":60,\"h\":10,\"align\":\"left\"},\"tall\":{\"x\":122,\"y\":45,\"w\":31,\"h\":5,\"align\":\"left\"}},\"bind\":{},\"source\":\"feedback\",\"custom\":\"Vol\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@divider\",\"scroll\":true,\"locked\":false},{\"id\":423,\"kind\":\"group\",\"name\":\"Play button\",\"hidden\":false,\"at\":{\"wide\":{\"x\":42,\"y\":38,\"w\":28,\"h\":28},\"tall\":{\"x\":24,\"y\":24,\"w\":14,\"h\":14}},\"bind\":{\"show\":{\"when\":{\"on\":\"paused\",\"not\":false}}},\"children\":[{\"id\":421,\"kind\":\"circle\",\"name\":\"\"