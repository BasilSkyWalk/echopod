[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 241
    let p0_1 = y + 65
    let p0_2 = y + 35
    let p0_3 = x + 211
    let p0_4 = x + 177
    let p0_5 = y + 1
    rect(x + 160, p0_5, 160, 146, #08080a)
    rect(x + 161, y, 1, 146, #313039)
    clip(x, y, 160, 146)
    if 0 {
        rect(x, y, 160, 146, #f7f3f7)
    }
    rect(x + 1, p0_5, 160, 144, #101010)
    item_icon(selected(), x + 55, p0_2, 50, 50, #f7f3f7)
    line(item(selected()), title, x + 31, y + 85, 98, 16, center, #f7f3f7)
    unclip()
    if has_cover {
        cover(p0_3, p0_2, 60)
        clip(p0_3, p0_2, 30, 30)
        ring((p0_0) * 16, (p0_1) * 16, 720, 480, #08080a)
        unclip()
        clip(p0_0, p0_2, 30, 30)
        ring((p0_0) * 16, (p0_1) * 16, 720, 480, #08080a)
        unclip()
        clip(p0_3, p0_1, 30, 30)
        ring((p0_0) * 16, (p0_1) * 16, 720, 480, #08080a)
        unclip()
        clip(p0_0, p0_1, 30, 30)
        ring((p0_0) * 16, (p0_1) * 16, 720, 480, #08080a)
        unclip()
    } else {
        rounded(p0_3, p0_2, 60, 60, 30, #313039)
    }
    line(song, body, p0_4, y + 101, 127, 22, center, #f7f3f7)
    line(artist, small, p0_4, y + 120, 127, 20, center, #8c8e94)
    line("Now Playing", small, p0_4, y + 6, 127, 20, center, #f7f3f7)
} else {
    let p0_0 = x + 86
    let p0_1 = y + 69
    let p0_2 = x + 54
    let p0_3 = y + 37
    let p0_4 = x + 18
    rect(x, y, 170, 156, #08080a)
    rect(x, y, 170, 1, #313039)
    if 1 {
        let gx_1 = x + 3
        let gy_1 = y + 4
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 2) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 6) {
            let cx_1 = gx_1 + (copy_1 - first_1) % 2 * 84
            let cy_1 = gy_1 + (copy_1 - first_1) / 2 * 92
            if copy_1 == chosen_1 {
                rect(cx_1, cy_1, 80, 88, #f7f3f7)
            }
            rect(cx_1 + 2, cy_1 + 2, 76, 84, #2161d6)
            item_icon(copy_1, cx_1 + 28, cy_1 + 25, 24, 24, #101010)
            line(item(copy_1), small, cx_1 + 7, cy_1 + 65, 66, 16, left, #101010)
        }
    }
    if has_cover {
        cover(p0_2, p0_3, 64)
        clip(p0_2, p0_3, 32, 32)
        ring((p0_0) * 16, (p0_1) * 16, 768, 512, #08080a)
        unclip()
        clip(p0_0, p0_3, 32, 32)
        ring((p0_0) * 16, (p0_1) * 16, 768, 512, #08080a)
        unclip()
        clip(p0_2, p0_1, 32, 32)
        ring((p0_0) * 16, (p0_1) * 16, 768, 512, #08080a)
        unclip()
        clip(p0_0, p0_1, 32, 32)
        ring((p0_0) * 16, (p0_1) * 16, 768, 512, #08080a)
        unclip()
    } else {
        rounded(p0_2, p0_3, 64, 64, 32, #313039)
    }
    line(song, body, p0_4, y + 107, 135, 23, center, #f7f3f7)
    line(artist, small, p0_4, y + 128, 135, 21, center, #8c8e94)
    line("Now Playing", small, p0_4, y + 6, 135, 21, center, #f7f3f7)
}
'''
