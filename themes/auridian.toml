name = "Auridian"
author = "blandpancakes"
description = "Derived from the Poster theme, with song info on the Home screen and more details on the Now Playing screen."
selection = "selection"

[spacing]
row_height = 26

[colors]
background = "#000000"
text = "#f7f7f7"
text_secondary = "#adadad"
text_tertiary = "#7c7c7c"
selection_background = "#181c21"
selection_top = "#181c21"
selection_shine = "#f7f7f7"
selection_text = "#ffffff"
header_background = "#141414"
header_top = "#282828"
header_text = "#f7f7f7"
divider = "#2c2c2c"
scrollbar_thumb = "#4a4a4a"
danger = "#e5484d"
success = "#30a46c"
chevron = "#6f6f6f"

[boxes.selection]
fill = "selection_background"
border = "selection_shine"
border_width = 2
border_edges = ["left"]
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "header_background"
ink = "header_text"

[boxes.toast]
fill = "selection_background"
ink = "text"
radius = 6

[boxes.section]
fill = "selection_background"
ink = "text"
radius = 8

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "text"
radius = 1

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

[now_playing_scene]
script = '''
rect(x, y, width, height, #000000)
if width > height {
    let p0_0 = x + 7
    let p0_1 = y + 106
    let p0_2 = x + 174
    let p0_3 = y + 121
    let p0_4 = x + 41
    let p0_5 = y + 126
    if has_cover {
        if has_cover {
            cover(p0_2, y, 146)
        } else {
            rect(p0_2, y, 146, 146, #2c2c2c)
        }
    }
    line(artist, body, p0_0, y + 24, 160, 24, left, #cacbd8)
    line(song, title, p0_0, y, 160, 24, left, (paused ? #adadad : #ffc800))
    line(album, small, p0_0, y + 48, 160, 17, left, #f7f7f7)
    format(small, p0_0, y + 65, 160, 16, left, #949494)
    text(detail, small, p0_0, y + 81, 160, 16, left, #949494)
    text(elapsed, small, p0_0, p0_3, 34, 14, left, #f7f7f7)
    rect(p0_4, p0_5, 86, 4, #2c2c2c)
    rect(p0_4, p0_5, (86 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 4, #f7f7f7)
    text(remaining, small, x + 127, p0_3, 40, 14, right, #adadad)
    text("SHUFFLE", small, p0_0, p0_1, 60, 15, left, (shuffle_mode != 0 ? #f7f7f7 : #2c2c2c))
    text("REPEAT", small, x + 75, p0_1, 46, 15, left, (repeat_mode != 0 ? #f7f7f7 : #2c2c2c))
    text("1", small, x + 125, p0_1, 8, 15, left, (repeat_mode == 1 ? #f7f7f7 : #2c2c2c))
    text("ALL", small, x + 137, p0_1, 30, 15, left, (repeat_mode == 2 ? #f7f7f7 : #2c2c2c))
} else {
    let p0_0 = x + 12
    let p0_1 = y + 133
    let p0_2 = y + 232
    let p0_3 = y + 256
    let p0_4 = x + 50
    let p0_5 = y + 262
    if has_cover {
        if has_cover {
            cover(x, y, 170)
        } else {
            rect(x, y, 170, 170, #2c2c2c)
        }
    }
    lattice(x, y + 160, 170, 10, 2, #000000)
    lattice(x, y + 167, 170, 3, 2, #000000)
    line(artist, body, p0_0, y + 174, 146, 16, left, #cacbd8)
    line(song, title, p0_0, y + 190, 146, 24, left, (paused ? #adadad : #ffc800))
    line(album, small, p0_0, y + 214, 146, 16, left, #f7f7f7)
    format(small, p0_0, p0_2, 146, 16, left, #949494)
    text(detail, small, p0_0, p0_2, 146, 16, left, #949494)
    text(elapsed, small, p0_0, p0_3, 34, 14, left, #f7f7f7)
    rect(p0_4, p0_5, 70, 2, #2c2c2c)
    rect(p0_4, p0_5, (70 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #f7f7f7)
    text(remaining, small, x + 122, p0_3, 36, 14, right, #adadad)
    text("SHUFFLE", small, x + 10, p0_1, 52, 15, left, (shuffle_mode != 0 ? #f7f7f7 : #2c2c2c))
    text("REPEAT", small, x + 68, p0_1, 46, 15, left, (repeat_mode != 0 ? #f7f7f7 : #2c2c2c))
    text("1", small, x + 118, p0_1, 8, 15, left, (repeat_mode == 1 ? #f7f7f7 : #2c2c2c))
    text("ALL", small, x + 130, p0_1, 30, 15, left, (repeat_mode == 2 ? #f7f7f7 : #2c2c2c))
}
'''
