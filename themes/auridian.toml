[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 189
    let p0_1 = x + 176
    let p0_2 = x + 6
    menu(x, y, 176, 146)
    rect(p0_1, y, 144, 146, #08080a)
    rect(p0_1, y, 1, 146, #2c2c2c)
    if has_cover {
        cover(p0_0, y, 119)
        reflect(p0_0, y, 119, 27)
    } else {
        rect(p0_0, y, 119, 119, #08080a)
    }
    if has_cover {
        cover(p0_0, y, 119)
        reflect(p0_0, y, 119, 27)
    } else {
        rect(p0_0, y, 119, 119, #08080a)
    }
    if present(song) {
        let gx_1 = x + 189
        let gy_1 = y + 119
        let p1_0 = gy_1 + 3
        rect(gx_1, gy_1, 119, 3, #2c2c2c)
        rect(gx_1, gy_1, (119 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #181c21)
        text(elapsed, small, gx_1, p1_0, 119, 14, left, #f7f7f7)
        text(remaining, small, gx_1 + 50, p1_0, 69, 14, right, #7c7c7c)
    }
    if present(song) {
        line(song, small, p0_2, y + 122, 165, 18, center, (paused ? #adadad : #ffc800))
    }
    if present(song) {
        spoke(p0_2, y + 121, 64, 16, 0, 164, #2c2c2c)
    }
} else {
    let p0_0 = y + 146
    let p0_1 = x + 31
    let p0_2 = x + 6
    menu(x, y, 170, 146)
    rect(x, p0_0, 170, 134, #08080a)
    rect(x, p0_0, 170, 1, #2c2c2c)
    if has_cover {
        cover(p0_1, p0_0, 109)
        reflect(p0_1, p0_0, 109, 25)
    } else {
        rect(p0_1, p0_0, 109, 109, #08080a)
    }
    if has_cover {
        cover(p0_1, p0_0, 109)
        reflect(p0_1, p0_0, 109, 25)
    } else {
        rect(p0_1, p0_0, 109, 109, #08080a)
    }
    if present(song) {
        let gx_1 = x + 31
        let gy_1 = y + 255
        let p1_0 = gy_1 + 3
        rect(gx_1, gy_1, 109, 3, #2c2c2c)
        rect(gx_1, gy_1, (109 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #181c21)
        text(elapsed, small, gx_1, p1_0, 109, 13, left, #f7f7f7)
        text(remaining, small, gx_1 + 46, p1_0, 63, 13, left, #7c7c7c)
    }
    if present(song) {
        line(song, small, p0_2, y + 122, 159, 18, center, (paused ? #adadad : #ffc800))
    }
    if present(song) {
        spoke(p0_2, y + 121, 64, 16, 0, 158, #2c2c2c)
    }
}
'''
