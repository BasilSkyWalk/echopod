[now_playing_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 152
    let p0_1 = x + 76
    let p0_2 = y + 73
    let p0_3 = y + 42
    let p0_4 = x + 176
    let p0_5 = y + 114
    if 1 {
        let lit_1_progress = progress(1000) * 48 / 1000
        repeat copy_1 from 0 to 48 {
            let turn_1 = (copy_1 * 5333 / 1000) & 255
            spoke(p0_1, p0_2, turn_1, 32, 60, 66, (copy_1 < lit_1_progress ? #6bf3c6 : #21305a))
        }
    }
    if has_cover {
        round_cover(p0_1, p0_2, 56)
    } else {
        ring((p0_1) * 16 + 8, (p0_2) * 16 + 8, 896, 0, #102039)
    }
    spoke(p0_1, p0_2, ((0 + tick * 3)) & 255, 32, 14, 20, #ffffff)
    line(song, title, p0_0, y + 18, 160, 22, left, #eff7ff)
    if present(feedback) {
        line(feedback, body, p0_0, p0_3, 160, 20, left, #9cb6de)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_0, p0_3, 160, 20, left, #9cb6de)
        } else {
            line(artist, body, p0_0, p0_3, 160, 20, left, #9cb6de)
        }
    }
    line(album, body, p0_0, y + 64, 160, 20, left, #738aad)
    format(small, p0_0, y + 90, 160, 16, left, #9cb6de)
    icon(badge != none ? badge : (playing ? none : pause), p0_0, y + 112, 18, 18, #6bf3c6)
    text(elapsed, small, p0_4, p0_5, 136, 14, left, #9cb6de)
    text(remaining, small, p0_4, p0_5, 136, 14, right, #738aad)
} else {
    let p0_0 = x + 8
    let p0_1 = x + 85
    let p0_2 = y + 62
    let p0_3 = y + 152
    let p0_4 = y + 250
    if 1 {
        let lit_1_progress = progress(1000) * 48 / 1000
        repeat copy_1 from 0 to 48 {
            let turn_1 = (copy_1 * 5333 / 1000) & 255
            spoke(p0_1, p0_2, turn_1, 32, 50, 56, (copy_1 < lit_1_progress ? #6bf3c6 : #21305a))
        }
    }
    if has_cover {
        round_cover(p0_1, p0_2, 48)
    } else {
        ring((p0_1) * 16 + 8, (p0_2) * 16 + 8, 768, 0, #102039)
    }
    spoke(p0_1, p0_2, ((0 + tick * 3)) & 255, 32, 14, 20, #ffffff)
    line(song, title, p0_0, y + 128, 154, 22, center, #eff7ff)
    if present(feedback) {
        line(feedback, body, p0_0, p0_3, 154, 20, center, #9cb6de)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_0, p0_3, 154, 20, center, #9cb6de)
        } else {
            line(artist, body, p0_0, p0_3, 154, 20, center, #9cb6de)
        }
    }
    line(album, body, p0_0, y + 174, 154, 20, center, #738aad)
    format(small, p0_0, y + 200, 154, 16, center, #9cb6de)
    icon(badge != none ? badge : (playing ? none : pause), x + 76, y + 222, 18, 18, #6bf3c6)
    text(elapsed, small, p0_0, p0_4, 154, 14, left, #9cb6de)
    text(remaining, small, p0_0, p0_4, 154, 14, right, #738aad)
}
'''
