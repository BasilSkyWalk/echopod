name = "Aurora"
author = "EchoPod"
description = "Northern lights: a tiled Home with a now-playing card, and a ring of lights around the cover"
selection = "selection"

[spacing]
row_height = 28

[colors]
background = "#070b16"
text = "#eef4ff"
text_secondary = "#9fb4d8"
text_tertiary = "#7488ae"
selection_background = "#12806e"
selection_top = "#16917a"
selection_shine = "#6ff0c4"
selection_text = "#ffffff"
header_background = "#0c1428"
header_top = "#16233f"
header_text = "#eef4ff"
divider = "#25335a"
scrollbar_thumb = "#3f5687"
danger = "#ff7a6b"
success = "#7ef0b0"
chevron = "#7488ae"

[boxes.selection]
fill = ["selection_top", "selection_background"]
ink = "selection_text"
shine = "selection_shine"
shine_height = 1
inset = [4, 2]
radius = 10
opacity = 75

[boxes.header]
fill = ["header_top", "header_background"]
ink = "header_text"
border = "divider"
border_width = 1
border_edges = ["bottom"]
opacity = 60

[boxes.toast]
fill = "header_top"
border = "selection_top"
border_width = 1
ink = "header_text"
radius = 10
opacity = 85

[boxes.section]
fill = "header_top"
border = "selection_top"
border_width = 1
ink = "header_text"
radius = 12
opacity = 85

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
radius = 2
opacity = 70

[icons]
chevron = [
    "3a2...",
    ".9e3..",
    "..9e3.",
    "...af3",
    "..9e3.",
    ".9e3..",
    "3a2...",
]

[wallpaper]
image = "aurora.png"

[wallpaper_portrait]
image = "aurora-tall.png"

[[accents]]
name = "Green"
selection_background = "#12806e"
selection_top = "#16917a"
selection_shine = "#6ff0c4"

[[accents]]
name = "Violet"
selection_background = "#5a3cae"
selection_top = "#7a5ad6"
selection_shine = "#b9a0ff"

[[accents]]
name = "Ice"
selection_background = "#2a6ab0"
selection_top = "#3f8fd8"
selection_shine = "#9fdcff"

[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 222
    let p0_1 = y + 14
    let p0_2 = x + 214
    let p0_3 = x + 220
    let p0_4 = y + 134
    if 1 {
        let gx_1 = x + 6
        let gy_1 = y + 8
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 1) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 4) {
            let cx_1 = gx_1 + (copy_1 - first_1) % 2 * 102
            let cy_1 = gy_1 + (copy_1 - first_1) / 2 * 44
            rounded(cx_1, cy_1, 96, 38, 10, (copy_1 == chosen_1 ? #10826b : #102039))
            line(item(copy_1), small, cx_1 + 4, cy_1, 88, 38, center, (copy_1 == chosen_1 ? #ffffff : #eff7ff))
        }
    }
    rounded(x + 210, y + 8, 104, 130, 12, #081429)
    if has_cover {
        cover(p0_0, p0_1, 80)
        reflect(p0_0, p0_1, 80, 10)
    } else {
        rect(p0_0, p0_1, 80, 80, #21305a)
    }
    line(song, small, p0_2, y + 104, 96, 16, center, #eff7ff)
    line(artist, small, p0_2, y + 118, 96, 14, center, #9cb6de)
    rect(p0_3, p0_4, 84, 2, #21305a)
    rect(p0_3, p0_4, (84 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #6bf3c6)
} else {
    let p0_0 = x + 49
    let p0_1 = y + 150
    let p0_2 = x + 12
    let p0_3 = x + 20
    let p0_4 = y + 268
    if 1 {
        let gx_1 = x + 4
        let gy_1 = y + 8
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 1) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 4) {
            let cx_1 = gx_1 + (copy_1 - first_1) % 2 * 84
            let cy_1 = gy_1 + (copy_1 - first_1) / 2 * 44
            rounded(cx_1, cy_1, 78, 38, 10, (copy_1 == chosen_1 ? #10826b : #102039))
            line(item(copy_1), small, cx_1 + 4, cy_1, 70, 38, center, (copy_1 == chosen_1 ? #ffffff : #eff7ff))
        }
    }
    rounded(x + 8, y + 144, 154, 130, 12, #081429)
    if has_cover {
        cover(p0_0, p0_1, 72)
        reflect(p0_0, p0_1, 72, 12)
    } else {
        rect(p0_0, p0_1, 72, 72, #21305a)
    }
    line(song, small, p0_2, y + 234, 146, 16, center, #eff7ff)
    line(artist, small, p0_2, y + 250, 146, 14, center, #9cb6de)
    rect(p0_3, p0_4, 130, 2, #21305a)
    rect(p0_3, p0_4, (130 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #6bf3c6)
}
'''
