name = "Mosaic"
author = "EchoPod"
description = "Flat tiles on black with one accent colour: clean and minimal"
selection = "selection"

[colors]
background = "#000000"
text = "#ffffff"
text_secondary = "#b3b3b3"
text_tertiary = "#808080"
selection_background = "#0050ef"
selection_top = "#266af1"
selection_shine = "#598df5"
selection_text = "#ffffff"
header_background = "#141414"
header_top = "#292929"
header_text = "#ffffff"
divider = "#2e2e2e"
scrollbar_thumb = "#4d4d4d"
danger = "#e5484d"
success = "#30a46c"
chevron = "#737373"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "background"
ink = "header_text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

[now_playing_scene]
script = '''
rect(x, y, width, height, #000000)
if width > height {
    let p0_0 = x + 10
    let p0_1 = x + 132
    let p0_2 = y + 8
    let p0_3 = y + 32
    let p0_4 = y + 128
    let p0_5 = y + 132
    if has_cover {
        cover(p0_0, p0_2, 112)
    } else {
        rect(p0_0, p0_2, 112, 112, #2e2e2e)
    }
    line(song, title, p0_1, p0_2, 180, 22, left, #ffffff)
    if present(feedback) {
        line(feedback, body, p0_1, p0_3, 180, 20, left, #b3b3b3)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_1, p0_3, 180, 20, left, #b3b3b3)
        } else {
            line(artist, body, p0_1, p0_3, 180, 20, left, #b3b3b3)
        }
    }
    line(album, body, p0_1, y + 54, 180, 20, left, #808080)
    rect(p0_0, p0_4, 300, 3, #2e2e2e)
    rect(p0_0, p0_4, (300 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #0050ef)
    text(elapsed, small, p0_0, p0_5, 300, 14, left, #b3b3b3)
    text(remaining, small, p0_0, p0_5, 300, 14, right, #808080)
} else {
    let p0_0 = x + 8
    let p0_1 = y + 154
    let p0_2 = x + 29
    let p0_3 = y + 8
    let p0_4 = y + 249
    let p0_5 = y + 258
    if has_cover {
        cover(p0_2, p0_3, 112)
    } else {
        rect(p0_2, p0_3, 112, 112, #2e2e2e)
    }
    line(song, title, p0_0, y + 126, 154, 22, center, #ffffff)
    if present(feedback) {
        line(feedback, body, p0_0, p0_1, 154, 20, center, #b3b3b3)
    }
    if !(present(feedback)) {
        if present(lyric) {
            line(lyric, body, p0_0, p0_1, 154, 20, center, #b3b3b3)
        } else {
            line(artist, body, p0_0, p0_1, 154, 20, center, #b3b3b3)
        }
    }
    line(album, body, p0_0, y + 180, 154, 20, center, #808080)
    rect(p0_0, p0_4, 154, 3, #2e2e2e)
    rect(p0_0, p0_4, (154 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #0050ef)
    text(elapsed, small, p0_0, p0_5, 154, 14, left, #b3b3b3)
    text(remaining, small, p0_0, p0_5, 154, 14, right, #808080)
}
'''
