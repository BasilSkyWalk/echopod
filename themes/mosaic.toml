[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    if 1 {
        let gx_1 = x + 2
        let gy_1 = y + 3
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 3 - 1) * 3
        repeat copy_1 from first_1 to min(items(), first_1 + 6) {
            let cx_1 = gx_1 + (copy_1 - first_1) % 3 * 106
            let cy_1 = gy_1 + (copy_1 - first_1) / 3 * 72
            if copy_1 == chosen_1 {
                rect(cx_1, cy_1, 102, 68, #ffffff)
            }
            rect(cx_1 + 2, cy_1 + 2, 98, 64, #0050ef)
            item_icon(copy_1, cx_1 + 39, cy_1 + 15, 24, 24, #ffffff)
            line(item(copy_1), small, cx_1 + 7, cy_1 + 45, 88, 16, left, #ffffff)
        }
    }
} else {
    if 1 {
        let gx_1 = x + 3
        let gy_1 = y + 4
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 2) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 6) {
            let cx_1 = gx_1 + (copy_1 - first_1) % 2 * 84
            let cy_1 = gy_1 + (copy_1 - first_1) / 2 * 92
            if copy_1 == chosen_1 {
                rect(cx_1, cy_1, 80, 88, #ffffff)
            }
            rect(cx_1 + 2, cy_1 + 2, 76, 84, #0050ef)
            item_icon(copy_1, cx_1 + 28, cy_1 + 25, 24, 24, #ffffff)
            line(item(copy_1), small, cx_1 + 7, cy_1 + 65, 66, 16, left, #ffffff)
        }
    }
}
'''
