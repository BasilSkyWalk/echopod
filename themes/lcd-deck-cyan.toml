selection_text = "#181821"
header_background = "#9a9996"
header_top = "#deddda"
header_text = "#223738"
divider = "#4a4952"
scrollbar_thumb = "#7b8a4a"
danger = "#ff614a"
success = "#7bcb63"
chevron = "#7b8a4a"

[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 192
    let p0_1 = y + 8
    let p0_2 = x + 176
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 1) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 4) {
            let cx_1 = x + (copy_1 - first_1) % 2 * 90
            let cy_1 = y + (copy_1 - first_1) / 2 * 73
            if copy_1 == chosen_1 {
                rect(cx_1, cy_1, 86, 69, #1b6970)
            }
            rect(cx_1 + 2, cy_1 + 2, 82, 65, #428488)
            item_icon(copy_1, cx_1 + 31, cy_1 + 15, 24, 24, #000000)
            line(item(copy_1), small, cx_1 + 7, cy_1 + 46, 72, 16, left, #000000)
        }
    }
    rect(p0_2, y, 144, 146, #08080a)
    rect(p0_2, y, 1, 146, #bdd1d0)
    if has_cover {
        cover(p0_0, p0_1, 112)
        reflect(p0_0, p0_1, 112, 26)
    } else {
        rect(p0_0, p0_1, 112, 112, #08080a)
    }
} else {
    let p0_0 = x + 19
    let p0_1 = y + 9
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 1) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 4) {
            let cx_1 = x + (copy_1 - first_1) % 2 * 87
            let cy_1 = y + (copy_1 - first_1) / 2 * 73
            if copy_1 == chosen_1 {
                rect(cx_1, cy_1, 83, 69, #1b6970)
            }
            rect(cx_1 + 2, cy_1 + 2, 79, 65, #428488)
            item_icon(copy_1, cx_1 + 29, cy_1 + 15, 24, 24, #000000)
            line(item(copy_1), small, cx_1 + 7, cy_1 + 46, 69, 16, left, #000000)
        }
    }
    rect(x, y, 170, 172, #08080a)
    rect(x, y, 170, 1, #bdd1d0)
    if has_cover {
        cover(p0_0, p0_1, 132)
        reflect(p0_0, p0_1, 132, 31)
    } else {
        rect(p0_0, p0_1, 132, 132, #08080a)
    }
}
'''
