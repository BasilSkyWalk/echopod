"scroll\":false},{\"id\":91,\"kind\":\"box\",\"name\":\"\",\"hidden\":false,\"at\":{\"wide\":{\"x\":169,\"y\":-26,\"w\":158,\"h\":26},\"tall\":{\"x\":0,\"y\":132,\"w\":170,\"h\":22}},\"bind\":{},\"fill\":\"wallpaper\",\"color\":\"@header_background\",\"top\":\"@header_top\",\"bottom\":\"@header_background\",\"radius\":0,\"border\":0,\"borderColor\":\"@divider\",\"taper\":0,\"grid\":0,\"gridColor\":\"@background\"},{\"id\":93,\"kind\":\"text\",\"name\":\"Hallo!\",\"hidden\":false,\"at\":{\"wide\":{\"x\":170,\"y\":89,\"w\":55,\"h\":20},\"tall\":{\"x\":8,\"y\":222,\"w\":154,\"h\":20,\"align\":\"center\"}},\"bind\":{},\"source\":\"custom\",\"custom\":\"EchoPod\",\"size\":\"small\",\"align\":\"left\",\"color\":\"@text\",\"scroll\":true},{\"id\":96,\"kind\":\"text\",\"name\":\"Lyrics\",\"hidden\":false,\"at\":{\"wide\":{\"x\":30,\"y\":-23,\"w\":218,\"h\":23,\"align\":\"center\"},\"tall\":{\"x\":43,\"y\":2,\"w\":107,\"h\":18,\"align\":\"center\"}},\"bind\":{},\"source\":\"lyric\",\"custom\":\"Hello\",\"size\":\"large\",\"align\":\"left\",\"color\":\"#fff700\",\"scroll\":true}],\"upright\":\"auto\"}"

[home_scene]
script = '''
backdrop(x, y, width, height)
if width > height {
    let p0_0 = x + 193
    let p0_1 = y + 4
    let p0_2 = x + 303
    let p0_3 = y + 114
    let p0_4 = x + 176
    let p0_5 = x + 195
    menu(x, y, 176, 146)
    rect(x + 177, y, 144, 146, #08080a)
    rect(p0_4, y, 1, 146, #393a3d)
    if has_cover {
        cover(p0_0, p0_1, 112)
        reflect(p0_0, p0_1, 112, 26)
        clip(p0_0, p0_1, 2, 2)
        ring((p0_5) * 16, (y + 6) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_2, p0_1, 2, 2)
        ring((p0_2) * 16, (y + 6) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_0, p0_3, 2, 2)
        ring((p0_5) * 16, (p0_3) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_2, p0_3, 2, 2)
        ring((p0_2) * 16, (p0_3) * 16, 48, 32, #08080a)
        unclip()
    } else {
        rounded(p0_0, p0_1, 112, 112, 2, #08080a)
    }
    rect(x + 179, y + 129, 141, 3, #393a3d)
    rect(x + 179, y + 129, (141 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #2f6fdb)
    text(elapsed, small, p0_4, y + 132, 144, 14, left, #aeafb2)
    text(remaining, small, p0_4, y + 132, 144, 14, right, #818285)
} else {
    let p0_0 = x + 63
    let p0_1 = y + 208
    let p0_2 = x + 105
    let p0_3 = y + 250
    let p0_4 = x + 57
    let p0_5 = x + 65
    menu(x, y, 170, 146)
    rect(x, y + 207, 170, 57, #08080a)
    rect(x + 85, y + 152, 0, 49, #393a3d)
    if has_cover {
        cover(p0_0, p0_1, 44)
        reflect(p0_0, p0_1, 44, 10)
        clip(p0_0, p0_1, 2, 2)
        ring((p0_5) * 16, (y + 210) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_2, p0_1, 2, 2)
        ring((p0_2) * 16, (y + 210) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_0, p0_3, 2, 2)
        ring((p0_5) * 16, (p0_3) * 16, 48, 32, #08080a)
        unclip()
        clip(p0_2, p0_3, 2, 2)
        ring((p0_2) * 16, (p0_3) * 16, 48, 32, #08080a)
        unclip()
    } else {
        rounded(p0_0, p0_1, 44, 44, 2, #08080a)
    }
    rect(p0_4, y + 257, 55, 1, #393a3d)
    rect(p0_4, y + 257, (55 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 1, #2f6fdb)
    text(elapsed, small, p0_4, y + 258, 57, 6, left, #aeafb2)
    text(remaining, small, p0_4, y + 258, 57, 6, right, #818285)
}
'''
