name = "fullscreen"
author = "Hejichs"
description = "a fullscreen theme, not too polished, i made this to test on my player"
selection = "selection"

[colors]
background = "#101114"
text = "#f2f2f5"
text_secondary = "#aeafb2"
text_tertiary = "#818285"
selection_background = "#2f6fdb"
selection_top = "#4e85e0"
selection_shine = "#78a1e8"
selection_text = "#000000"
header_background = "#222326"
header_top = "#343538"
header_text = "#f2f2f5"
divider = "#393a3d"
scrollbar_thumb = "#545558"
danger = "#e5484d"
success = "#30a46c"
chevron = "#767679"

[boxes.selection]
fill = ["selection_top", "selection_background"]
shine = "selection_shine"
shine_height = 1
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = ["header_top", "header_background"]
ink = "header_text"
opacity = 47

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

[now_playing_scene]
script = '''
rect(x, y, width, height, #101114)
if width > height {
    let p0_0 = x + 169
    let p0_1 = y - 26
    let p0_2 = x + 170
    let p0_3 = x - 1
    let p0_4 = y + 26
    let p0_5 = y + 129
    if has_cover {
        cover(p0_3, p0_1, 170)
    } else {
        rect(p0_3, p0_1, 170, 170, #393a3d)
    }
    line(song, title, p0_0, y, 151, 22, center, #f2f2f5)
    if present(feedback) {
        line(feedback, body, p0_2, p0_4, 150, 20, left, #aeafb2)
    }
    if !(present(feedback)) {
        line(artist, body, p0_2, p0_4, 150, 20, center, #aeafb2)
    }
    line(album, body, p0_0, y + 50, 151, 20, center, #818285)
    format(small, p0_0, y + 109, 151, 16, left, #aeafb2)
    rect(x, p0_5, 320, 3, #393a3d)
    rect(x, p0_5, (321 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 3, #2f6fdb)
    text(elapsed, small, x, y + 132, 300, 14, left, #f2f2f5)
    text(remaining, small, x + 20, y + 132, 300, 14, right, #f2f2f5)
    backdrop(p0_0, p0_1, 158, 26)
    line("EchoPod", small, p0_2, y + 89, 55, 20, left, #f2f2f5)
    if present(lyric) {
        line(lyric, title, x + 30, y - 23, 218, 23, center, #fff700)
    } else {
        line(artist, title, x + 30, y - 23, 218, 23, center, #fff700)
    }
} else {
    let p0_0 = x + 20
    let p0_1 = y + 176
    let p0_2 = y + 119
    let p0_3 = y + 122
    let p0_4 = x + 43
    let p0_5 = y + 2
    if has_cover {
        cover(p0_0, y, 131)
    } else {
        rect(p0_0, y, 131, 131, #393a3d)
    }
    line(song, title, x, y + 154, 170, 22, center, #f2f2f5)
    if present(feedback) {
        line(feedback, body, x, p0_1, 170, 20, left, #aeafb2)
    }
    if !(present(feedback)) {
        line(artist, body, x, p0_1, 170, 20, center, #aeafb2)
    }
    line(album, body, x, y + 196, 170, 20, center, #818285)
    format(small, x, y + 256, 170, 16, center, #aeafb2)
    rect(p0_0, p0_2, 130, 2, #393a3d)
    rect(p0_0, p0_2, (130 * (volume_shown ? volume_width(1000) : progress(1000)) / 1000), 2, #2f6fdb)
    text(elapsed, small, p0_0, p0_3, 130, 11, left, #f2f2f5)
    text(remaining, small, x + 36, p0_3, 115, 11, right, #f2f2f5)
    backdrop(x, y + 132, 170, 22)
    line("EchoPod", small, x + 8, y + 222, 154, 20, center, #f2f2f5)
    if present(lyric) {
        line(lyric, title, p0_4, p0_5, 107, 18, center, #fff700)
    } else {
        line(artist, title, p0_4, p0_5, 107, 18, center, #fff700)
    }
}
'''
