[home_scene]
script = '''
if width > height {
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 4 - 1) * 4
        repeat copy_1 from first_1 to min(items(), first_1 + 8) {
            let cx_1 = x + 3 + (copy_1 - first_1) % 4 * 83
            let cy_1 = y + 3 + (copy_1 - first_1) / 4 * 72
            rounded(cx_1 - 2, cy_1 + 2, 64, 64, 32, (copy_1 % 4 == 0 ? #ed730c : copy_1 % 4 == 1 ? #5c5c5b : copy_1 % 4 == 2 ? #969696 : #d5d5d5))
            if copy_1 == chosen_1 {
                rounded(cx_1 + 1, cy_1 + 5, 58, 58, 32, (copy_1 % 4 == 0 ? #f3a461 : copy_1 % 4 == 1 ? #969696 : copy_1 % 4 == 2 ? #d5d5d5 : #ffffff))
            }
            text(item(copy_1), small, cx_1 - 7, cy_1 + 68, 68, 16, center, #000000)
        }
    }
} else {
    if 1 {
        let chosen_1 = selected()
        let first_1 = max(0, chosen_1 / 2 - 2) * 2
        repeat copy_1 from first_1 to min(items(), first_1 + 6) {
            let cx_1 = x + 8 + (copy_1 - first_1) % 2 * 84
            let cy_1 = y + 10 + (copy_1 - first_1) / 2 * 92
            rounded(cx_1 + 2, cy_1 + 2, 64, 64, 32, (copy_1 % 4 == 0 ? #ed730c : copy_1 % 4 == 1 ? #5c5c5b : copy_1 % 4 == 2 ? #8b8b8a : #d5d5d5))
            if copy_1 == chosen_1 {
                rounded(cx_1 + 5, cy_1 + 5, 58, 58, 32, (copy_1 % 4 == 0 ? #f3a461 : copy_1 % 4 == 1 ? #969696 : copy_1 % 4 == 2 ? #d5d5d5 : #ffffff))
            }
            text(item(copy_1), small, cx_1 + 1, cy_1 + 67, 68, 16, center, #000000)
        }
    }
}
