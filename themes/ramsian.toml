# Fonts: From a font with an open licence, like the SIL Open Font License
name = "Ramsian"
author = "August Van Zorn"
description = "Inspired by the audio gear design of Dieter Rams"
selection = "selection"
cover_flow = "dark"

[colors]
background = "#ffffff"
text = "#161615"
text_secondary = "#5c5c5b"
text_tertiary = "#8b8b8a"
selection_background = "#ed730c"
selection_top = "#f08830"
selection_shine = "#f3a461"
selection_text = "#000000"
header_background = "#d6d6d6"
header_top = "#858585"
header_text = "#000000"
divider = "#d5d5d5"
scrollbar_thumb = "#b9b9b9"
danger = "#e5484d"
success = "#2fa16a"
chevron = "#969696"

[boxes.selection]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_flat]
fill = "selection_background"
ink = "selection_text"

[boxes.selection_outline]
fill = "background"
border = "selection_top"
border_width = 1
border_edges = "all"
ink = "selection_top"
inset = [6, 1]

[boxes.header]
fill = "header_background"
ink = "text"

[boxes.toast]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.section]
fill = "header_background"
border = "divider"
border_width = 1
border_edges = "all"
ink = "header_text"

[boxes.scrollbar_thumb]
fill = "scrollbar_thumb"
ink = "background"

[boxes.progress_track]
fill = "divider"
ink = "background"

[boxes.progress_fill]
fill = "text"
ink = "background"

[boxes.progress_active]
fill = "selection_background"
ink = "background"

